<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج الصيانة – مستشفى الابتسامة</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#1f4e79;--bd:#d0d5dd;--ok:#c6efce;--warn:#ffeb9c;--bad:#ffc7ce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1e2530;--tx:#e8ecf2;--mut:#98a2b3;--pri:#6fa8dc;--bd:#394150;--ok:#1e4d2b;--warn:#5c4b13;--bad:#5c2229}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1e2530;--tx:#e8ecf2;--mut:#98a2b3;--pri:#6fa8dc;--bd:#394150;--ok:#1e4d2b;--warn:#5c4b13;--bad:#5c2229}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px}
header{background:var(--pri);color:#fff;padding:12px 14px;font-weight:700;font-size:16px}
nav{display:flex;gap:6px;padding:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:0 0 auto;padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:8px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);max-width:100%}
.btn{padding:8px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center;white-space:normal;word-break:break-word;vertical-align:middle}
th{white-space:nowrap}
textarea{resize:none;overflow:hidden;width:100%;min-width:150px;line-height:1.5;display:block}
th{background:var(--pri);color:#fff;position:sticky;top:0}
td.l{text-align:right;white-space:normal;min-width:140px}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-bad{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.k b{display:block;font-size:24px}
.fl{background:var(--pri);color:#fff;font-weight:700}
.msg{color:var(--mut);font-size:12px}
#rep{--card:#fff;--tx:#000;--bd:#999;--ok:#c6efce;--warn:#ffeb9c;--bad:#ffc7ce;--pri:#1f4e79;background:#fff;color:#000}

/* ---- توافق الشاشات ---- */
html{-webkit-text-size-adjust:100%}
.row label{flex:1 1 150px}
.row label input,.row label select,.row label textarea{width:100%}
.btn,select,input{min-height:38px}
@media (max-width:720px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  main{padding:6px}
  header{font-size:15px;padding:10px}
  .row{flex-direction:column;align-items:stretch}
  .row label{flex:1 1 auto}
  .row label textarea{width:100%!important}
  .btn{width:100%;min-height:44px}
  .wrap{overflow:visible}
  table.rt,table.rt tbody{display:block;width:100%}
  table.rt tr:first-child{display:none}
  table.rt tr{display:block;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:4px 8px;background:var(--card)}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px dashed var(--bd);text-align:right;padding:6px 2px}
  table.rt td:last-child{border-bottom:0}
  table.rt td::before{content:attr(data-l);color:var(--mut);font-size:12px;flex:0 0 36%;text-align:right}
  table.rt td.l{min-width:0}
  table.rt td.fl{justify-content:center;border-radius:6px}
  table.rt td.fl::before{content:none}
  table.rt td.s-ok,table.rt td.s-bad,table.rt td.s-warn{border-radius:6px}
  table.rt select,table.rt input,table.rt textarea{flex:1;min-width:0!important;width:100%;max-width:62%}
  .grid{grid-template-columns:repeat(2,1fr)}
}
.btn.sm{width:auto!important;min-height:28px;padding:2px 10px;font-size:12px;margin-inline-start:6px}
@media (min-width:721px){
  .wrap:not(#rep){max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);overflow:auto}
  table th{position:sticky;top:0;z-index:3}
}
.pdfing .noprint{display:none!important}
@media (min-width:721px){
  td select,td textarea,td input:not([type=checkbox]){width:100%;min-width:0}
  td input[type=date]{min-width:130px}
  td select{min-width:95px}
  td textarea{min-width:140px}
  td.l{min-width:130px}
}
#prv{position:fixed;inset:0;z-index:70;background:#e5e7eb;overflow:auto;padding:10px}
#prv .prtools{background:var(--card);color:var(--tx);padding:10px;border-radius:8px;margin:0 auto 10px;max-width:794px}
.prpage{background:#fff;color:#000;width:794px;margin:0 auto 12px;padding:16px;direction:ltr;font-family:Arial,Tahoma,sans-serif;font-size:11px;box-sizing:border-box}
.prpage table{border-collapse:collapse;width:100%;margin:0}
.prpage td,.prpage th{border:1px solid #000;padding:3px 5px;vertical-align:middle;text-align:center;background:#fff;color:#000;position:static;white-space:normal}
.prpage .bi{display:flex;justify-content:space-between;gap:6px;text-align:left}
.prpage .ar{direction:rtl;text-align:right}
.prpage .t{font-weight:700;font-size:15px}
.prpage .g{font-size:9px;color:#444}
@media print{body>*:not(#prv){display:none!important}#prv{position:static;background:#fff;padding:0;overflow:visible}#prv .prtools{display:none!important}.prpage{margin:0;width:100%;padding:0;page-break-after:always;break-after:page}@page{size:A4 portrait;margin:8mm}}
@media (min-width:1400px){main{max-width:1500px}}
</style>
</head>
<body>
<header>برنامج الصيانة – مستشفى الابتسامة – مصر الجديدة <small style="opacity:.7;font-weight:400">(إصدار 4-11 – و)</small></header>
<nav id="nav"></nav>
<main id="main"></main>
<script src="firebase-config.js"></script>
<script>
/* طبقة الربط مع Firebase (Firestore + تسجيل دخول) */
(function(){
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  let dbP=null;
  function loginUI(au,auth){
    if(document.getElementById('lg'))return;
    const d=document.createElement('div');d.id='lg';
    d.style.cssText='position:fixed;inset:0;background:#14181f;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
    d.innerHTML='<div style="background:#fff;color:#000;border-radius:12px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;font-family:inherit"><b style="font-size:16px">تسجيل الدخول – برنامج الصيانة</b><input id="lge" type="email" placeholder="البريد الإلكتروني" dir="ltr" style="padding:10px;border:1px solid #999;border-radius:6px"><input id="lgp" type="password" placeholder="كلمة المرور" dir="ltr" style="padding:10px;border:1px solid #999;border-radius:6px"><button id="lgb" style="padding:10px;border:0;border-radius:8px;background:#1f4e79;color:#fff;font:inherit">دخول</button><span id="lgm" style="color:#b42318;font-size:12px"></span></div>';
    document.body.appendChild(d);
    const go=()=>au.signInWithEmailAndPassword(auth,document.getElementById('lge').value.trim(),document.getElementById('lgp').value).catch(()=>{document.getElementById('lgm').textContent='البريد أو كلمة المرور غير صحيحة'});
    document.getElementById('lgb').onclick=go;
    document.getElementById('lgp').onkeydown=e=>{if(e.key==='Enter')go()};
  }
  async function boot(){
    const [a,f,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=a.initializeApp(window.FIREBASE_CONFIG);
    const auth=au.getAuth(app);
    const fs=f.initializeFirestore(app,{localCache:f.persistentLocalCache(),ignoreUndefinedProperties:true});
    await new Promise(res=>au.onAuthStateChanged(auth,u=>{if(u){const l=document.getElementById('lg');if(l)l.remove();window.USER_EMAIL=u.email;window.ROLE=(!window.ADMIN_EMAIL||(u.email||'').toLowerCase()===window.ADMIN_EMAIL.toLowerCase())?'admin':'entry';res()}else loginUI(au,auth)}));
    return{collection:n=>({
      onSnapshot:cb=>f.onSnapshot(f.collection(fs,n),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))})),
      doc:id=>({set:d=>f.setDoc(f.doc(fs,n,id),d),update:d=>f.updateDoc(f.doc(fs,n,id),d),delete:()=>f.deleteDoc(f.doc(fs,n,id))})})};
  }
  const DL={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  window.claude={use:async n=>n==='db'?(dbP=dbP||boot()):n==='downloads'?DL:null};
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const CATS=['كهرباء','سباكة','نجارة','نقاشة','ألومنيوم','شاشة','التكييف'];
const AREAS=[["الدور الثاني",["غرفة 201","غرفة 202","غرفة 203","غرفة 204","غرفة 205","غرفة 206","غرفة 207","غرفة 208","غرفة 209","غرفة 210","الحضانة","غرفة النفايات – الدور الثاني","الكافتيريا","العمليات","مخزن أدوية فرعي – الدور الثاني"]],
["الدور الأول",["عيادة 1","عيادة 2","عيادة 3","عيادة 4","عيادة 5","غرفة الدعم الطبي","حمام رجالي – الدور الأول","حمام حريمي – الدور الأول","غرفة 100 (حسابات المرضى)","غرفة 101 (استراحة د. الأطفال)","غرفة 102","غرفة 103","غرفة 104 (نائب د. النساء)","غرفة 105","غرفة 106","غرفة 107 (مخزن)","غرفة 108 (مخزن الفندقة)","مكتب مديرة الفندقة","مخزن أدوية رئيسي"]],
["الدور الأرضي",["الريسيبشن","مكتب مدير المستشفى","الخزن","غرفة طوارئ","غرفة IT","معمل التحليل","معمل الذكورة","التعقيم","الصيدلية","المطبخ","المغسلة","حمام رجالي – الأرضي","حمام حريمي – الأرضي"]]];
const ALL=AREAS.flatMap(([f,l])=>l.map(a=>({f,a})));
const ST=['تم الإصلاح','تم جزئياً','إصلاح مؤقت','جاري التنفيذ','لم يتم الإصلاح','غير قابل للإصلاح'];
const PST=['لم يُطلب','جاري إعداد الطلب','تم الطلب','تم الشراء/التوريد','تم التركيب'];
const stCls=s=>s==='تم الإصلاح'?'s-ok':['تم جزئياً','إصلاح مؤقت','جاري التنفيذ'].includes(s)?'s-warn':s?'s-bad':'';
let db=null,notices=[],purchases=[],rounds={},tab='daily',settings={},auditLog=[],pmTasks=[],pmLogs={},rdate=ymd(new Date());
const $=s=>document.querySelector(s);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function goDay(v){const d=getDraft();if(d.dirty&&!confirm('فيه تعديلات غير محفوظة في المرور الحالي. تتجاهلها؟'))return render();draft=null;rdate=v;render()}
function shiftDay(n){const d=new Date(rdate+'T12:00:00');d.setDate(d.getDate()+n);goDay(ymd(d))}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=r=>parseInt(String(r).replace(/\D/g,''))||0;
const ref=n=>'ع-'+String(n).padStart(2,'0');
const fd=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-GB')};
const toD=v=>{if(!v)return'';if(v instanceof Date)return v;const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],m[2]-1,+m[1]);const d=new Date(v);return isNaN(d)?String(v):d};
const iso=v=>{const d=toD(v);return d instanceof Date?d.toISOString().slice(0,10):d};

async function init(){
  nav();render();
  try{db=wrapDb(await claude.use('db'))}catch(e){db=null}
  if(!db){$('#main').insertAdjacentHTML('afterbegin','<div class="card s-bad">تعذر الاتصال بقاعدة البيانات؛ راجع إعدادات firebase-config.js.</div>');return}
  if(window.ROLE==='entry'){tab='e_round';nav();render();return}
  db.collection('inbox').onSnapshot(s=>procInbox(s.docs.map(d=>({id:d.id,o:d.data()}))));
  const t=setTimeout(()=>{},10000);
  db.collection('notices').onSnapshot(s=>{notices=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n-b.n);clearTimeout(t);render()});
  db.collection('purchases').onSnapshot(s=>{purchases=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.k-b.k);render()});
  db.collection('rounds').onSnapshot(s=>{rounds={};s.docs.forEach(d=>rounds[d.id]=d.data());render()});
  db.collection('settings').onSnapshot(s=>{settings={};s.docs.forEach(d=>settings[d.id]=d.data());render()});
  db.collection('auditLog').onSnapshot(s=>{auditLog=s.docs.map(d=>d.data()).sort((a,b)=>String(b.at).localeCompare(String(a.at)));render()});
  db.collection('pmTasks').onSnapshot(s=>{pmTasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.asset).localeCompare(String(b.asset),'ar'));render()});
  db.collection('pmLogs').onSnapshot(s=>{pmLogs={};s.docs.forEach(d=>pmLogs[d.id]=d.data());render()});
}
function nav(){
  const T=window.ROLE==='entry'?[['e_round','مرور يومي'],['e_notice','إخطار جديد'],['e_purch','طلب شراء']]:[['daily','المتابعة اليومية'],['round','المرور اليومي'],['notices','الصيانة العلاجية'],['purch','طلبات الشراء'],['pm','الصيانة الوقائية'],['sum','الملخص'],['reports','التقارير'],['kpi','مؤشرات KPI'],['eval','تقييم الأداء'],['audit','سجل التعديلات'],['backup','نسخ احتياطي']];
  $('#nav').innerHTML=T.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';nav();render();window.scrollTo(0,0)">${v}</button>`).join('');
}
function render(){
  if(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&document.activeElement.dataset.keep)return;
  const wy=window.scrollY,ws=[...document.querySelectorAll('.wrap:not(#rep)')].map(w=>[w.scrollTop,w.scrollLeft]);
  $('#main').innerHTML=({round:vRound,notices:vNotices,purch:vPurch,sum:vSum,reports:vReports,daily:vDaily,pm:vPM,backup:vBackup,kpi:vKPI,eval:vEval,audit:vAudit,e_round:vERound,e_notice:vENotice,e_purch:vEPurch})[tab]();
  document.querySelectorAll('textarea').forEach(fit);
  labelize();
  document.querySelectorAll('.wrap:not(#rep)').forEach((w,i)=>{if(ws[i]){w.scrollTop=ws[i][0];w.scrollLeft=ws[i][1]}});
  window.scrollTo(0,wy);
}
function labelize(){
  document.querySelectorAll('main table').forEach(t=>{
    if(t.closest('#rep')||!t.rows.length||t.rows[0].cells[0].tagName!=='TH')return;
    t.classList.add('rt');const hs=[...t.rows[0].cells].map(c=>c.textContent.trim());
    [...t.rows].slice(1).forEach(r=>{if(r.cells.length===hs.length)[...r.cells].forEach((c,i)=>c.dataset.l=hs[i])});
  });
}
function fit(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
let lastN=0,lastK=0;
const nextN=()=>(lastN=Math.max(lastN,...notices.map(n=>n.n))+1);
const nextK=()=>(lastK=Math.max(lastK,...purchases.map(p=>p.k))+1);
async function addNotice(o){
  const n=nextN(),d={n,ref:ref(n),status:'لم يتم الإصلاح',...o};if(!d.prio)d.prio=autoPrio(d.dept,d.details);
  notices.push({id:'n'+String(n).padStart(4,'0'),...d});
  await db.collection('notices').doc('n'+String(n).padStart(4,'0')).set(d);
}
/* ---------- المرور اليومي (افتراضي: الكل سليم ✓) ---------- */
let draft=null;
function getDraft(){if(!draft||draft.date!==rdate){const r=rounds[rdate];draft={date:rdate,dirty:false,saved:!!r,marks:{...((r&&r.marks)||{})},notes:{...((r&&r.notes)||{})}}}return draft}
const fullMarks=d=>{const m={};ALL.forEach((x,i)=>CATS.forEach((c,j)=>m[i+'_'+j]=d.marks[i+'_'+j]||'✓'));return m};
function roundTable(d,withOpen){
  const bad=Object.values(fullMarks(d)).filter(x=>x==='✗').length;
  const stTxt=d.dirty?'⚠ تعديلات غير محفوظة':(d.saved&&withOpen)?'✔ محفوظ':'لم يُحفظ بعد – الكل ✓ افتراضياً';
  const stCls2=d.dirty?'s-warn':(d.saved&&withOpen)?'s-ok':'';
  let h=`<div class="card"><div class="row"><button class="btn alt" onclick="shiftDay(-1)">◀ اليوم السابق</button><button class="btn alt" onclick="goDay(ymd(new Date()))">اليوم</button><button class="btn alt" onclick="shiftDay(1)">اليوم التالي ▶</button>
  <label>التاريخ (${DAYS[new Date(rdate+'T12:00:00').getDay()]})<input type="date" value="${rdate}" onchange="goDay(this.value)"></label></div>
  <div class="row" style="margin-top:8px"><span class="${stCls2}" style="padding:6px 10px;border-radius:6px"><b>${stTxt}</b></span><span><b>الأعطال المحددة: ${bad}</b></span><button class="btn" onclick="saveRound()">حفظ المرور اليومي</button></div>
  <div class="msg">كل الخانات سليمة ✓ افتراضياً؛ غيّر الخانات اللي فيها مشكلة فقط (✗) واكتب الملاحظة، ثم اضغط حفظ مرة واحدة. الأعطال بتتسجل في الصيانة العلاجية عند الحفظ.</div></div>
  <div class="card wrap"><table><tr><th>المكان</th>${CATS.map(c=>`<th>${c}</th>`).join('')}<th>ملاحظات</th>${withOpen?'<th>مفتوح بالعلاجية</th>':''}</tr>`;
  let last='';
  ALL.forEach((x,i)=>{
    if(x.f!==last){h+=`<tr><td class="fl" colspan="${CATS.length+2+(withOpen?1:0)}">${x.f}</td></tr>`;last=x.f}
    const occ=CATS.every((c,j)=>d.marks[i+'_'+j]==='مشغولة');
    h+=`<tr><td class="l"><span>${x.a}</span> <button class="btn sm ${occ?'':'alt'}" onclick="occupy(${i})">${occ?'✔ مشغولة':'مشغولة'}</button></td>`+CATS.map((c,j)=>{const m=d.marks[i+'_'+j]||'✓';
      return `<td class="${m==='✗'?'s-bad':m==='✓'?'s-ok':''}"><select onchange="dSet(${i},${j},this.value)">${['✓','✗','مشغولة','لا يوجد'].map(o=>`<option ${o===m?'selected':''}>${o}</option>`).join('')}</select></td>`}).join('')
      +`<td><textarea rows="1" data-keep="1" oninput="fit(this)" onchange="dNote(${i},this.value)">${esc(d.notes[i])}</textarea></td>`;
    if(withOpen){const open=notices.filter(n=>n.status!=='تم الإصلاح'&&n.dept&&n.dept.includes(x.a)).length;h+=`<td class="${open?'s-warn':''}">${open||''}</td>`}
    h+='</tr>';
  });
  return h+'</table></div><div class="card"><button class="btn" onclick="saveRound()">حفظ المرور اليومي</button></div>';
}
function vRound(){return roundTable(getDraft(),true)}
function vERound(){return roundTable(getDraft(),false)}
function occupy(i){const d=getDraft();const all=CATS.every((c,j)=>d.marks[i+'_'+j]==='مشغولة');CATS.forEach((c,j)=>d.marks[i+'_'+j]=all?'✓':'مشغولة');d.dirty=true;render()}
function dSet(i,j,v){const d=getDraft();d.marks[i+'_'+j]=v;d.dirty=true;render()}

const REP_START='2026-11-07'; // السبت: بداية العمل بالتقارير
let repType='w',repSel='';
const lastThu=(y,m)=>{const d=new Date(y,m+1,0);while(d.getDay()!==4)d.setDate(d.getDate()-1);return ymd(d)};
const dFmt=v=>{const [y,m,d]=v.split('-');return d+'/'+m+'/'+y};
function weekOptions(){const o=[],t=ymd(new Date());let d=new Date(REP_START+'T12:00:00');
  while(ymd(d)<=t){const e=new Date(d);e.setDate(e.getDate()+6);o.push({v:ymd(d),from:ymd(d),to:ymd(e)});d.setDate(d.getDate()+7)}return o.reverse()}
function monthOptions(){const o=[],s0=new Date(REP_START+'T12:00:00'),t=new Date();let y=s0.getFullYear(),m=s0.getMonth();
  while(y<t.getFullYear()||(y===t.getFullYear()&&m<=t.getMonth())){const f=ymd(new Date(y,m,1));o.push({v:y+'-'+(m+1),from:f<REP_START?REP_START:f,to:lastThu(y,m)});m++;if(m>11){m=0;y++}}return o.reverse()}
function repData(from,to){
  const inR=v=>{const x=iso(v);return typeof x==='string'&&x>=from&&x<=to};
  const today=ymd(new Date());
  const nNew=notices.filter(n=>inR(n.date)),nClosed=notices.filter(n=>n.status==='تم الإصلاح'&&inR(n.fixdate));
  const dd=nClosed.map(n=>(new Date(iso(n.fixdate))-new Date(iso(n.date)))/864e5).filter(x=>!isNaN(x)&&x>=0);
  const avg=dd.length?dd.reduce((a,b)=>a+b,0)/dd.length:null;
  const rs=Object.entries(rounds).filter(([d])=>d>=from&&d<=to);
  const byA={},byC={},rec={};let bad=0;
  rs.forEach(([d,r])=>Object.entries(r.marks||{}).forEach(([k,v])=>{if(v!=='✗')return;const [i,j]=k.split('_');const a=ALL[i].a,c=CATS[j];bad++;byA[a]=(byA[a]||0)+1;byC[c]=(byC[c]||0)+1;rec[a+' – '+c]=(rec[a+' – '+c]||0)+1}));
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lastDay=to<today?to:today,span=Math.max(0,Math.round((new Date(lastDay)-new Date(from))/864e5)+1);
  const open=notices.filter(n=>n.status!=='تم الإصلاح').map(n=>({...n,age:Math.round((new Date(today)-new Date(iso(n.date)))/864e5)})).filter(n=>!isNaN(n.age)).sort((a,b)=>b.age-a.age).slice(0,5);
  const pa=purchases.filter(p=>inR(p.rdate)).length,pd=purchases.filter(p=>p.status==='تم الشراء/التوريد'&&inR(p.ddate)||p.status==='تم التركيب'&&inR(p.ddate)).length,pi=purchases.filter(p=>inR(p.idate)).length,pp=purchases.filter(p=>p.status!=='تم التركيب').length;
  const slaOk=nClosed.filter(n=>slaInfo(n).txt==='ضمن المهلة').length;
  return{slaOk,nNew,nClosed,avg,days:rs.length,span,bad,byA:top(byA),byC:top(byC),rec:top(rec).filter(x=>x[1]>=2),open,pa,pd,pi,pp,openNow:notices.filter(n=>n.status!=='تم الإصلاح').length};
}
function vReports(){
  const opts=repType==='w'?weekOptions():monthOptions();
  let h=`<div class="card"><div class="row"><button class="btn ${repType==='w'?'':'alt'}" onclick="repType='w';repSel='';render()">تقرير أسبوعي (السبت – الجمعة)</button><button class="btn ${repType==='m'?'':'alt'}" onclick="repType='m';repSel='';render()">تقرير شهري (حتى آخر خميس)</button></div>`;

async function checkAutoClose(ref){

async function delItem(kind,id){
  if(kind==='notices'){
    const n=notices.find(x=>x.id===id);if(!n)return;const its=purchases.filter(p=>p.ref===n.ref);
    if(!confirm('حذف الإخطار '+n.ref+' ('+(n.dept||'')+')؟'+(its.length?'\nمرتبط بـ '+its.length+' صنف شراء وسيُفك ارتباطها.':'')))return;

    await db.collection('notices').doc(id).delete();

const PR=['حرج','عاجل','عادي'],SLA_H={'حرج':4,'عاجل':24,'عادي':72};
const CRIT=['العمليات','الحضانة','طوارئ','غازات','الغازات','مولد','المولد','مصعد','المصعد','التعقيم'];
const autoPrio=(dept,det)=>CRIT.some(k=>((dept||'')+' '+(det||'')).includes(k))?'حرج':'عادي';
const prCls=p=>p==='حرج'?'s-bad':p==='عاجل'?'s-warn':'';
function slaInfo(n){
  const pr=n.prio||autoPrio(n.dept,n.details),h=SLA_H[pr],d=iso(n.date);
  if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return{pr,txt:'',cls:'',over:false};
  const m=String(n.time||'').match(/^(\d{1,2}):(\d{2})/),tm=m?m[1].padStart(2,'0')+':'+m[2]:'08:00';
  const dl=new Date(new Date(d+'T'+tm+':00').getTime()+h*36e5);
  if(n.status==='تم الإصلاح'){const f=iso(n.fixdate);if(typeof f!=='string'||!f)return{pr,txt:'',cls:'',over:false};const ok=f<=ymd(dl);return{pr,txt:ok?'ضمن المهلة':'تجاوز المهلة',cls:ok?'s-ok':'s-bad',over:false}}
  const left=dl-new Date(),a=Math.abs(left)/36e5,t=a<48?Math.round(a)+' س':Math.round(a/24)+' يوم';
  return left>=0?{pr,txt:'متبقي '+t,cls:left<h*36e5*0.25?'s-warn':'',over:false}:{pr,txt:'متأخر '+t,cls:'s-bad',over:true};
}

const dayBefore=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-1);return ymd(x)};
function pAll(f,until){const out=[];let p=pPeriod(f,PM_START);while(p.start<=until){out.push(p);const n=new Date(p.end+'T12:00:00');n.setDate(n.getDate()+1);p=pPeriod(f,ymd(n))}return out}
const pmAct=()=>pmTasks.filter(t=>t.active!==false&&FQ.includes(t.freq));
function pmCur(today){const tasks=pmAct();let notDone=0;const missed=[];
  tasks.forEach(t=>{const c=pPeriod(t.freq,today);if(!pmLogs[t.id+'_'+c.key])notDone++;const pv=pPeriod(t.freq,dayBefore(c.start));if(pv.end>=PM_START&&!pmLogs[t.id+'_'+pv.key])missed.push(t)});
  return{tasks:tasks.length,notDone,missed}}
function pmCompliance(today){let tot=0,done=0;pmAct().forEach(t=>pAll(t.freq,today).filter(p=>p.end<today).forEach(p=>{tot++;if(pmLogs[t.id+'_'+p.key])done++}));return{tot,done,pct:tot?Math.round(100*done/tot):null}}
function pmRows(from,to){return FQ.map(f=>{const ts=pmAct().filter(t=>t.freq===f);
  const ps=pAll(f,to).filter(p=>(f==='أسبوعي'||f==='شهري')?(p.end>=from&&p.start<=to):(p.end>=from&&p.end<=to));
  const tot=ts.length*ps.length;let dn=0;ts.forEach(t=>ps.forEach(p=>{if(pmLogs[t.id+'_'+p.key])dn++}));
  return[f,dn,tot,tot?Math.round(100*dn/tot)+'%':'—']})}

      else if(o.type==='round')await applyRound(d.date,d.marks,d.notes||{},o.by);
      else if(o.type==='mark'){
        const r=rounds[d.date]||{marks:{},notes:{}};r.marks=r.marks||{};r.notes=r.notes||{};r.marks[d.i+'_'+d.j]=d.v;if(d.note)r.notes[d.i]=d.note;rounds[d.date]=r;

        const a=ALL[d.i].a,c=CATS[d.j];
        if(d.v==='✗'&&!notices.find(n=>n.src==='مرور'&&n.dept===a&&n.cat===c&&n.status!=='تم الإصلاح'))
          await addNotice({date:d.date,dept:a,reporter:'المرور اليومي',details:(d.note||'عطل')+' – '+c,src:'مرور',cat:c,by:o.by});
      }
      await db.collection('inbox').doc(x.id).delete();
    }catch(e){doneI.delete(x.id)}
  }
}

/* ---------- سجل التعديلات ---------- */
const SEC={notices:'الصيانة العلاجية',purchases:'طلبات الشراء',pmTasks:'مهام وقائية',rounds:'المرور اليومي'};
const FL={status:'الحالة',details:'العطل',action:'الإجراء',dept:'القسم',reporter:'المبلّغ',date:'التاريخ',time:'الوقت',fixdate:'تاريخ الإصلاح',rep:'ممثل الصيانة',needbuy:'يحتاج شراء',notes:'ملاحظات',prio:'الأولوية',cls:'التصنيف',item:'الصنف',qty:'الكمية',price:'السعر',ref:'الإخطار',rdate:'تاريخ الطلب',ddate:'تاريخ التوريد',idate:'تاريخ التركيب',code:'الكود',spec:'مواصفات',task:'المهمة',asset:'الأصل',freq:'التكرار',active:'نشطة'};
const SKIP=['id','n','by','src','cat','viaPurchase'];
function wrapDb(raw){
  const T={notices:()=>notices,purchases:()=>purchases,pmTasks:()=>pmTasks};
  const lbl=(c,o)=>c==='notices'?((o.ref||'')+' '+(o.dept||'')).trim():c==='purchases'?(o.item||''):c==='pmTasks'?(o.task||''):'';
  const cut=v=>{v=v===undefined||v===null?'':v;v=typeof v==='object'?JSON.stringify(v):String(v);return v.length>100?v.slice(0,100)+'…':v};
  const diff=(a,b)=>{const ch={};Object.keys(b).forEach(k=>{if(SKIP.includes(k))return;if(JSON.stringify(a[k]??'')!==JSON.stringify(b[k]??''))ch[k]=[cut(a[k]),cut(b[k])]});return ch};
  const log=(col,id,action,o,ch,by)=>{
    if(window.NOLOG||!(col in T||col==='rounds'))return;
    if(action==='تعديل'&&ch&&!Object.keys(ch).length)return;
    raw.collection('auditLog').doc('a'+Date.now()+Math.random().toString(36).slice(2,6)).set({at:new Date().toISOString(),by:by||window.USER_EMAIL||'',col,id,label:col==='rounds'?id:lbl(col,o||{}),action,ch:ch&&Object.keys(ch).length?ch:null}).catch(()=>{});
  };
  return{collection:name=>{const c=raw.collection(name);const find=id=>T[name]?T[name]().find(x=>x.id===id):null;return{
    onSnapshot:cb=>c.onSnapshot(cb),
    doc:id=>{const d=c.doc(id);return{
      set:async v=>{const old=find(id);await d.set(v);if(name==='rounds')log(name,id,'حفظ مرور',v,null);else{const ch=old?diff(old,v):{};log(name,id,(!old||!Object.keys(ch).length)?'إضافة':'تعديل',v,old?ch:null,v&&v.by)}},
      update:async v=>{const old=find(id)||{};await d.update(v);log(name,id,'تعديل',{...old,...v},diff(old,v))},
      delete:async()=>{const old=find(id)||{};await d.delete();log(name,id,'حذف',old,null)}}}}}};
}

let auditF={sec:'',q:''};
/* ---------- مؤشرات KPI وتقييم الأداء ---------- */
let kRange={from:'2026-09-21',to:''};
const pf=v=>v===null||v===undefined?'—':(Math.round(v*1000)/10)+'%';
function kpiCalc(from,to){
  const inR=v=>{const x=iso(v);return typeof x==='string'&&x>=from&&x<=to};
  const ns=notices.filter(n=>inR(n.date)&&n.status),tot=ns.length,cnt=st=>ns.filter(n=>n.status===st).length,closed=ns.filter(n=>n.status==='تم الإصلاح');
  const pr=purchases.filter(p=>inR(p.rdate)&&p.item),pt=pr.length,PL=['تم الطلب','تم الشراء/التوريد','تم التركيب'],DV=['تم الشراء/التوريد','تم التركيب'];
  const cls=notices.filter(n=>inR(n.date)&&n.cls),today=ymd(new Date());
  const sl=closed.filter(n=>slaInfo(n).txt),pcm=pmCompliance(today);
  const k=[
   {n:1,t:'نسبة إغلاق الإخطارات',h:'تم الإصلاح ÷ الإخطارات التي لها حالة',v:tot?cnt('تم الإصلاح')/tot:null,min:.85},
   {n:2,t:'نسبة الإصلاحات المؤقتة',h:'إصلاح مؤقت ÷ الإخطارات التي لها حالة',v:tot?cnt('إصلاح مؤقت')/tot:null,max:.1},
   {n:3,t:'نسبة الإخطارات المفتوحة',h:'(جاري التنفيذ + لم يتم + تم جزئياً) ÷ الإجمالي',v:tot?(cnt('جاري التنفيذ')+cnt('لم يتم الإصلاح')+cnt('تم جزئياً'))/tot:null,max:.15},
   {n:4,t:'نسبة غير القابل للإصلاح',h:'التصنيف الأصلي غير قابل للإصلاح ÷ الإخطارات ذات تصنيف أصلي',v:cls.length?cls.filter(n=>n.cls==='غير قابل للإصلاح').length/cls.length:null,max:.05},
   {n:5,t:'اكتمال بيانات الإخطارات',h:'الخانات المعبأة (التاريخ، القسم، العطل، الإجراء، ممثل الصيانة) ÷ المطلوب',v:tot?ns.reduce((a,n)=>a+['date','dept','details','action','rep'].filter(f=>n[f]).length,0)/(tot*5):null,min:.9},
   {n:6,t:'توثيق تاريخ الإصلاح للمُغلق',h:'المُغلق وله تاريخ إصلاح ÷ إجمالي المُغلق',v:closed.length?closed.filter(n=>n.fixdate).length/closed.length:null,min:.9},
   {n:7,t:'تقدّم طلبات الشراء',h:'(تم الطلب + التوريد + التركيب) ÷ إجمالي الأصناف',v:pt?pr.filter(p=>PL.includes(p.status)).length/pt:null,min:.8},
   {n:8,t:'تنفيذ الشراء والتوريد',h:'(تم الشراء/التوريد + تم التركيب) ÷ إجمالي الأصناف',v:pt?pr.filter(p=>DV.includes(p.status)).length/pt:null,min:.6},
   {n:10,t:'إخطارات تحتاج شراء بلا صنف مسجل',h:'عدد',cnt:true,v:notices.filter(n=>inR(n.date)&&n.needbuy==='نعم'&&!purchases.some(p=>p.ref===n.ref)).length,max:0},
   {n:11,t:'الإغلاق ضمن المهلة (مضاف)',h:'المُغلق ضمن مهلة أولويته ÷ المُغلق',v:sl.length?sl.filter(n=>slaInfo(n).txt==='ضمن المهلة').length/sl.length:null,min:.8},
   {n:12,t:'الالتزام بالصيانة الوقائية (مضاف)',h:'المهام المنفذة ÷ المطلوبة في الفترات المنتهية',v:pcm.pct===null?null:pcm.pct/100,min:.9}];
  k.forEach(x=>{x.ok=x.v===null?null:((x.min===undefined||x.v>=x.min)&&(x.max===undefined||x.v<=x.max))});
  return k;
}
function kRangeCard(){return `<div class="card"><div class="row"><label>من<input type="date" value="${kRange.from}" onchange="kRange.from=this.value;render()"></label><label>إلى (فارغ = اليوم)<input type="date" value="${kRange.to}" onchange="kRange.to=this.value;render()"></label></div></div>`}
const kr=()=>({from:kRange.from||'2000-01-01',to:kRange.to||ymd(new Date())});
function vKPI(){
  const {from,to}=kr(),k=kpiCalc(from,to),ok=k.filter(x=>x.ok===true).length,bad=k.filter(x=>x.ok===false).length,nn=k.filter(x=>x.ok===null).length;
  return kRangeCard()+`<div class="card"><button class="btn" onclick="pdf('مؤشرات_KPI_'+ymd(new Date()))">تصدير PDF</button></div>
  <div class="card" id="rep"><h3>مؤشرات الأداء الرئيسية (KPIs) – إدارة الصيانة – مستشفى الابتسامة</h3><div class="msg">الفترة: ${dFmt(from)} → ${dFmt(to)}</div>
  <div class="grid" style="margin:8px 0"><div class="k"><b>${ok}</b>مؤشرات محققة</div><div class="k"><b>${bad}</b>غير محققة</div><div class="k"><b>${nn}</b>لم تُدخل بعد</div><div class="k"><b>${ok+bad?pf(ok/(ok+bad)):'—'}</b>نسبة التحقق (من المُدخل)</div></div>
  <div style="overflow-x:auto"><table><tr>${['#','المؤشر','طريقة الحساب','الحد الأدنى','الحد الأقصى','الفعلي','الحالة'].map(x=>`<th>${x}</th>`).join('')}</tr>
  ${k.map(x=>`<tr><td>${x.n}</td><td class="l">${x.t}</td><td class="l">${x.h}</td><td>${x.min!==undefined?pf(x.min):''}</td><td>${x.max!==undefined?(x.cnt?x.max:pf(x.max)):''}</td><td><b>${x.cnt?x.v:pf(x.v)}</b></td><td class="${x.ok===true?'s-ok':x.ok===false?'s-bad':''}">${x.ok===true?'محقق':x.ok===false?'غير محقق':'—'}</td></tr>`).join('')}</table></div>
  <div class="msg" style="margin-top:6px">المؤشران 11 و12 مضافان على نموذجك الأصلي. لا يدخلان في حساب تقييم الأداء.</div></div>`;
}
const EV=[{a:'الاستجابة للأعطال وإغلاقها',w:40,c:'نسبة إغلاق الإخطارات',f:k=>k[0].v},
 {a:'جودة الإصلاح (حلول نهائية)',w:40,c:'1 − نسبة الإصلاحات المؤقتة',f:k=>k[1].v===null?null:1-k[1].v},
 {a:'إدارة المشتريات والتكاليف',w:10,c:'تقدّم طلبات الشراء',f:k=>k[6].v},
 {a:'التوثيق والتقارير',w:10,c:'متوسط: اكتمال البيانات، توثيق تاريخ الإصلاح',f:k=>{const a=[k[4].v,k[5].v].filter(x=>x!==null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}}];
function saveEv(p){const e=settings.eval=Object.assign({},settings.eval,p);return db.collection('settings').doc('eval').set(e)}
function evAdj(i,v){const a=Object.assign({},(settings.eval||{}).adj);if(v==='')delete a[i];else a[i]=+v;saveEv({adj:a})}
function evNote(i,v){const a=Object.assign({},(settings.eval||{}).notes);a[i]=v;saveEv({notes:a})}
function vEval(){
  const {from,to}=kr(),k=kpiCalc(from,to),ev=settings.eval||{},adj=ev.adj||{},nt=ev.notes||{};
  const rows=EV.map((x,i)=>{const auto=x.f(k),ap=adj[i]!==undefined&&adj[i]!==''?adj[i]/100:auto;return{...x,auto,ap,sc:ap===null?null:x.w*ap}});
  const totW=EV.reduce((a,x)=>a+x.w,0),evW=rows.filter(r=>r.ap!==null).reduce((a,r)=>a+r.w,0),sum=rows.reduce((a,r)=>a+(r.sc||0),0);
  const norm=evW?sum/evW*100:null,cov=evW/totW;
  const grade=norm===null?'لا يوجد تقييم':(norm>=90?'ممتاز':norm>=75?'جيد جداً':norm>=60?'جيد':'يحتاج خطة تحسين')+(cov<1?' (تقييم جزئي)':'');
  const ok=k.filter(x=>x.ok===true).length,bad=k.filter(x=>x.ok===false).length;
  return kRangeCard()+`<div class="card"><button class="btn" onclick="pdf('تقييم_الأداء_'+ymd(new Date()))">تصدير PDF</button></div>
  <div class="card" id="rep"><h3>تقييم أداء مدير الصيانة – محسوب تلقائياً من بيانات المتابعة</h3>
  <div class="grid" style="margin:8px 0"><div class="k"><b>${norm===null?'—':norm.toFixed(1)}</b>الدرجة المعيارية (من 100)</div><div class="k"><b style="font-size:18px">${grade}</b>التقدير العام</div><div class="k"><b>${Math.round(cov*100)}%</b>اكتمال التقييم (وزن المحاور المقيّمة)</div><div class="k"><b>${ok} من ${ok+bad}</b>مؤشرات محققة</div></div>
  <div class="row" style="margin-bottom:8px"><label>اسم المدير<input data-keep="1" value="${esc(ev.name??'م/ محمد خالد المحمدي')}" onchange="saveEv({name:this.value})"></label><label>فترة التقييم<input data-keep="1" value="${esc(ev.period??'من 21/9/2026')}" onchange="saveEv({period:this.value})"></label><label>المقيّم<input data-keep="1" value="${esc(ev.evaluator??'')}" onchange="saveEv({evaluator:this.value})"></label></div>
  <div style="overflow-x:auto"><table><tr>${['المحور','الدرجة','المؤشر','النسبة التلقائية','تعديل النسبة (%)','النسبة المعتمدة','الدرجة المحققة','ملاحظات'].map(x=>`<th>${x}</th>`).join('')}</tr>
  ${rows.map((r,i)=>`<tr><td class="l">${r.a}</td><td>${r.w}</td><td class="l">${r.c}</td><td>${pf(r.auto)}</td><td><input type="number" min="0" max="100" data-keep="1" value="${adj[i]??''}" style="width:80px" onchange="evAdj(${i},this.value)"></td><td>${pf(r.ap)}</td><td><b>${r.sc===null?'—':r.sc.toFixed(1)}</b></td><td class="l"><input data-keep="1" value="${esc(nt[i]||'')}" onchange="evNote(${i},this.value)"></td></tr>`).join('')}
  <tr><td class="l"><b>الإجمالي</b></td><td><b>${totW}</b></td><td class="l">${rows.filter(r=>r.ap!==null).length} من ${EV.length} محاور مقيّمة</td><td></td><td></td><td></td><td><b>${sum.toFixed(1)}</b></td><td></td></tr></table></div>
  <div class="msg" style="margin-top:6px">سلّم التقدير (على الدرجة المعيارية): 90 فأكثر ممتاز · 75–89 جيد جداً · 60–74 جيد · أقل من 60 يحتاج خطة تحسين.<br>الدرجة الحالية من 100: ${sum.toFixed(1)} · الدرجة المعيارية = الدرجة المحققة ÷ وزن المحاور المقيّمة.</div>
  <div style="display:flex;justify-content:space-between;margin-top:24px"><span>توقيع المدير: ____________</span><span>المقيّم: ${esc(ev.evaluator||'____________')}</span><span>اعتماد الإدارة العليا: ____________</span></div></div>`;
}
