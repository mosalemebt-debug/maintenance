<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج الصيانة – مستشفى الابتسامة</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#1f4e79;--bd:#d0d5dd;--ok:#c6efce;--warn:#ffeb9c;--bad:#ffc7ce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1e2530;--tx:#e8ecf2;--mut:#98a2b3;--pri:#6fa8dc;--bd:#394150;--ok:#1e4d2b;--warn:#5c4b13;--bad:#5c2229}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1e2530;--tx:#e8ecf2;--mut:#98a2b3;--pri:#6fa8dc;--bd:#394150;--ok:#1e4d2b;--warn:#5c4b13;--bad:#5c2229}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px}
header{background:var(--pri);color:#fff;padding:12px 14px;font-weight:700;font-size:16px}
nav{display:flex;gap:6px;padding:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:0 0 auto;padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:8px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);max-width:100%}
.btn{padding:8px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center;white-space:normal;word-break:break-word;vertical-align:middle}
th{white-space:nowrap}
textarea{resize:none;overflow:hidden;width:100%;min-width:150px;line-height:1.5;display:block}
th{background:var(--pri);color:#fff;position:sticky;top:0}
td.l{text-align:right;white-space:normal;min-width:140px}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-bad{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.k b{display:block;font-size:24px}
.fl{background:var(--pri);color:#fff;font-weight:700}
.msg{color:var(--mut);font-size:12px}
#rep{--card:#fff;--tx:#000;--bd:#999;--ok:#c6efce;--warn:#ffeb9c;--bad:#ffc7ce;--pri:#1f4e79;background:#fff;color:#000}

/* ---- توافق الشاشات ---- */
html{-webkit-text-size-adjust:100%}
.row label{flex:1 1 150px}
.row label input,.row label select,.row label textarea{width:100%}
.btn,select,input{min-height:38px}
@media (max-width:720px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  main{padding:6px}
  header{font-size:15px;padding:10px}
  .row{flex-direction:column;align-items:stretch}
  .row label{flex:1 1 auto}
  .row label textarea{width:100%!important}
  .btn{width:100%;min-height:44px}
  .wrap{overflow:visible}
  table.rt,table.rt tbody{display:block;width:100%}
  table.rt tr:first-child{display:none}
  table.rt tr{display:block;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:4px 8px;background:var(--card)}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px dashed var(--bd);text-align:right;padding:6px 2px}
  table.rt td:last-child{border-bottom:0}
  table.rt td::before{content:attr(data-l);color:var(--mut);font-size:12px;flex:0 0 36%;text-align:right}
  table.rt td.l{min-width:0}
  table.rt td.fl{justify-content:center;border-radius:6px}
  table.rt td.fl::before{content:none}
  table.rt td.s-ok,table.rt td.s-bad,table.rt td.s-warn{border-radius:6px}
  table.rt select,table.rt input,table.rt textarea{flex:1;min-width:0!important;width:100%;max-width:62%}
  .grid{grid-template-columns:repeat(2,1fr)}
}
.btn.sm{width:auto!important;min-height:28px;padding:2px 10px;font-size:12px;margin-inline-start:6px}
@media (min-width:721px){
  .wrap:not(#rep){max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);overflow:auto}
  table th{position:sticky;top:0;z-index:3}
}
.pdfing .noprint{display:none!important}
@media (min-width:721px){
  td select,td textarea,td input:not([type=checkbox]){width:100%;min-width:0}
  td input[type=date]{min-width:130px}
  td select{min-width:95px}
  td textarea{min-width:140px}
  td.l{min-width:130px}
}
@media (min-width:1400px){main{max-width:1500px}}
</style>
</head>
<body>
<header>برنامج الصيانة – مستشفى الابتسامة – مصر الجديدة <small style="opacity:.7;font-weight:400">(إصدار 4-11 – شامل)</small></header>
<nav id="nav"></nav>
<main id="main"></main>
<script src="firebase-config.js"></script>
<script>
/* طبقة الربط مع Firebase (Firestore + تسجيل دخول) */
(function(){
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  let dbP=null;
  function loginUI(au,auth){
    if(document.getElementById('lg'))return;
    const d=document.createElement('div');d.id='lg';
    d.style.cssText='position:fixed;inset:0;background:#14181f;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
    d.innerHTML='<div style="background:#fff;color:#000;border-radius:12px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;font-family:inherit"><b style="font-size:16px">تسجيل الدخول – برنامج الصيانة</b><input id="lge" type="email" placeholder="البريد الإلكتروني" dir="ltr" style="padding:10px;border:1px solid #999;border-radius:6px"><input id="lgp" type="password" placeholder="كلمة المرور" dir="ltr" style="padding:10px;border:1px solid #999;border-radius:6px"><button id="lgb" style="padding:10px;border:0;border-radius:8px;background:#1f4e79;color:#fff;font:inherit">دخول</button><span id="lgm" style="color:#b42318;font-size:12px"></span></div>';
    document.body.appendChild(d);
    const go=()=>au.signInWithEmailAndPassword(auth,document.getElementById('lge').value.trim(),document.getElementById('lgp').value).catch(()=>{document.getElementById('lgm').textContent='البريد أو كلمة المرور غير صحيحة'});
    document.getElementById('lgb').onclick=go;
    document.getElementById('lgp').onkeydown=e=>{if(e.key==='Enter')go()};
  }
  async function boot(){
    const [a,f,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=a.initializeApp(window.FIREBASE_CONFIG);
    const auth=au.getAuth(app);
    const fs=f.initializeFirestore(app,{localCache:f.persistentLocalCache(),ignoreUndefinedProperties:true});
    await new Promise(res=>au.onAuthStateChanged(auth,u=>{if(u){const l=document.getElementById('lg');if(l)l.remove();window.USER_EMAIL=u.email;window.ROLE=(!window.ADMIN_EMAIL||(u.email||'').toLowerCase()===window.ADMIN_EMAIL.toLowerCase())?'admin':'entry';res()}else loginUI(au,auth)}));
    return{collection:n=>({
      onSnapshot:cb=>f.onSnapshot(f.collection(fs,n),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))})),
      doc:id=>({set:d=>f.setDoc(f.doc(fs,n,id),d),update:d=>f.updateDoc(f.doc(fs,n,id),d),delete:()=>f.deleteDoc(f.doc(fs,n,id))})})};
  }
  const DL={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  window.claude={use:async n=>n==='db'?(dbP=dbP||boot()):n==='downloads'?DL:null};
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const CATS=['كهرباء','سباكة','نجارة','نقاشة','ألومنيوم','شاشة','التكييف'];
const AREAS=[["الدور الثاني",["غرفة 201","غرفة 202","غرفة 203","غرفة 204","غرفة 205","غرفة 206","غرفة 207","غرفة 208","غرفة 209","غرفة 210","الحضانة","غرفة النفايات – الدور الثاني","الكافتيريا","العمليات","مخزن أدوية فرعي – الدور الثاني"]],
["الدور الأول",["عيادة 1","عيادة 2","عيادة 3","عيادة 4","عيادة 5","غرفة الدعم الطبي","حمام رجالي – الدور الأول","حمام حريمي – الدور الأول","غرفة 100 (حسابات المرضى)","غرفة 101 (استراحة د. الأطفال)","غرفة 102","غرفة 103","غرفة 104 (نائب د. النساء)","غرفة 105","غرفة 106","غرفة 107 (مخزن)","غرفة 108 (مخزن الفندقة)","مكتب مديرة الفندقة","مخزن أدوية رئيسي"]],
["الدور الأرضي",["الريسيبشن","مكتب مدير المستشفى","الخزن","غرفة طوارئ","غرفة IT","معمل التحليل","معمل الذكورة","التعقيم","الصيدلية","المطبخ","المغسلة","حمام رجالي – الأرضي","حمام حريمي – الأرضي"]]];
const ALL=AREAS.flatMap(([f,l])=>l.map(a=>({f,a})));
const ST=['تم الإصلاح','تم جزئياً','إصلاح مؤقت','جاري التنفيذ','لم يتم الإصلاح','غير قابل للإصلاح'];
const PST=['لم يُطلب','جاري إعداد الطلب','تم الطلب','تم الشراء/التوريد','تم التركيب'];
const stCls=s=>s==='تم الإصلاح'?'s-ok':['تم جزئياً','إصلاح مؤقت','جاري التنفيذ'].includes(s)?'s-warn':s?'s-bad':'';
let db=null,notices=[],purchases=[],rounds={},tab='daily',rdate=ymd(new Date());
const $=s=>document.querySelector(s);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function goDay(v){const d=getDraft();if(d.dirty&&!confirm('فيه تعديلات غير محفوظة في المرور الحالي. تتجاهلها؟'))return render();draft=null;rdate=v;render()}
function shiftDay(n){const d=new Date(rdate+'T12:00:00');d.setDate(d.getDate()+n);goDay(ymd(d))}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=r=>parseInt(String(r).replace(/\D/g,''))||0;
const ref=n=>'ع-'+String(n).padStart(2,'0');
const fd=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-GB')};
const toD=v=>{if(!v)return'';if(v instanceof Date)return v;const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],m[2]-1,+m[1]);const d=new Date(v);return isNaN(d)?String(v):d};
const iso=v=>{const d=toD(v);return d instanceof Date?d.toISOString().slice(0,10):d};

async function init(){
  nav();render();
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){$('#main').insertAdjacentHTML('afterbegin','<div class="card s-bad">تعذر الاتصال بقاعدة البيانات؛ راجع إعدادات firebase-config.js.</div>');return}
  if(window.ROLE==='entry'){tab='e_round';nav();render();return}
  db.collection('inbox').onSnapshot(s=>procInbox(s.docs.map(d=>({id:d.id,o:d.data()}))));
  const t=setTimeout(()=>{},10000);
  db.collection('notices').onSnapshot(s=>{notices=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n-b.n);clearTimeout(t);render()});
  db.collection('purchases').onSnapshot(s=>{purchases=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.k-b.k);render()});
  db.collection('rounds').onSnapshot(s=>{rounds={};s.docs.forEach(d=>rounds[d.id]=d.data());render()});
}
function nav(){
  const T=window.ROLE==='entry'?[['e_round','مرور يومي'],['e_notice','إخطار جديد'],['e_purch','طلب شراء']]:[['daily','المتابعة اليومية'],['round','المرور اليومي'],['notices','الصيانة العلاجية'],['purch','طلبات الشراء'],['sum','الملخص'],['reports','التقارير']];
  $('#nav').innerHTML=T.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';nav();render();window.scrollTo(0,0)">${v}</button>`).join('');
}
function render(){
  if(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&document.activeElement.dataset.keep)return;
  const wy=window.scrollY,ws=[...document.querySelectorAll('.wrap:not(#rep)')].map(w=>[w.scrollTop,w.scrollLeft]);
  $('#main').innerHTML=({round:vRound,notices:vNotices,purch:vPurch,sum:vSum,reports:vReports,daily:vDaily,e_round:vERound,e_notice:vENotice,e_purch:vEPurch})[tab]();
  document.querySelectorAll('textarea').forEach(fit);
  labelize();
  document.querySelectorAll('.wrap:not(#rep)').forEach((w,i)=>{if(ws[i]){w.scrollTop=ws[i][0];w.scrollLeft=ws[i][1]}});
  window.scrollTo(0,wy);
}
function labelize(){
  document.querySelectorAll('main table').forEach(t=>{
    if(t.closest('#rep')||!t.rows.length||t.rows[0].cells[0].tagName!=='TH')return;
    t.classList.add('rt');const hs=[...t.rows[0].cells].map(c=>c.textContent.trim());
    [...t.rows].slice(1).forEach(r=>{if(r.cells.length===hs.length)[...r.cells].forEach((c,i)=>c.dataset.l=hs[i])});
  });
}
function fit(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
let lastN=0,lastK=0;
const nextN=()=>(lastN=Math.max(lastN,...notices.map(n=>n.n))+1);
const nextK=()=>(lastK=Math.max(lastK,...purchases.map(p=>p.k))+1);
async function addNotice(o){
  const n=nextN(),d={n,ref:ref(n),status:'لم يتم الإصلاح',...o};
  notices.push({id:'n'+String(n).padStart(4,'0'),...d});
  await db.collection('notices').doc('n'+String(n).padStart(4,'0')).set(d);
}
/* ---------- المرور اليومي (افتراضي: الكل سليم ✓) ---------- */
let draft=null;
function getDraft(){if(!draft||draft.date!==rdate){const r=rounds[rdate];draft={date:rdate,dirty:false,saved:!!r,marks:{...((r&&r.marks)||{})},notes:{...((r&&r.notes)||{})}}}return draft}
const fullMarks=d=>{const m={};ALL.forEach((x,i)=>CATS.forEach((c,j)=>m[i+'_'+j]=d.marks[i+'_'+j]||'✓'));return m};
function roundTable(d,withOpen){
  const bad=Object.values(fullMarks(d)).filter(x=>x==='✗').length;
  const stTxt=d.dirty?'⚠ تعديلات غير محفوظة':(d.saved&&withOpen)?'✔ محفوظ':'لم يُحفظ بعد – الكل ✓ افتراضياً';
  const stCls2=d.dirty?'s-warn':(d.saved&&withOpen)?'s-ok':'';
  let h=`<div class="card"><div class="row"><button class="btn alt" onclick="shiftDay(-1)">◀ اليوم السابق</button><button class="btn alt" onclick="goDay(ymd(new Date()))">اليوم</button><button class="btn alt" onclick="shiftDay(1)">اليوم التالي ▶</button>
  <label>التاريخ (${DAYS[new Date(rdate+'T12:00:00').getDay()]})<input type="date" value="${rdate}" onchange="goDay(this.value)"></label></div>
  <div class="row" style="margin-top:8px"><span class="${stCls2}" style="padding:6px 10px;border-radius:6px"><b>${stTxt}</b></span><span><b>الأعطال المحددة: ${bad}</b></span><button class="btn" onclick="saveRound()">حفظ المرور اليومي</button></div>
  <div class="msg">كل الخانات سليمة ✓ افتراضياً؛ غيّر الخانات اللي فيها مشكلة فقط (✗) واكتب الملاحظة، ثم اضغط حفظ مرة واحدة. الأعطال بتتسجل في الصيانة العلاجية عند الحفظ.</div></div>
  <div class="card wrap"><table><tr><th>المكان</th>${CATS.map(c=>`<th>${c}</th>`).join('')}<th>ملاحظات</th>${withOpen?'<th>مفتوح بالعلاجية</th>':''}</tr>`;
  let last='';
  ALL.forEach((x,i)=>{
    if(x.f!==last){h+=`<tr><td class="fl" colspan="${CATS.length+2+(withOpen?1:0)}">${x.f}</td></tr>`;last=x.f}
    const occ=CATS.every((c,j)=>d.marks[i+'_'+j]==='مشغولة');
    h+=`<tr><td class="l"><span>${x.a}</span> <button class="btn sm ${occ?'':'alt'}" onclick="occupy(${i})">${occ?'✔ مشغولة':'مشغولة'}</button></td>`+CATS.map((c,j)=>{const m=d.marks[i+'_'+j]||'✓';
      return `<td class="${m==='✗'?'s-bad':m==='✓'?'s-ok':''}"><select onchange="dSet(${i},${j},this.value)">${['✓','✗','مشغولة','لا يوجد'].map(o=>`<option ${o===m?'selected':''}>${o}</option>`).join('')}</select></td>`}).join('')
      +`<td><textarea rows="1" data-keep="1" oninput="fit(this)" onchange="dNote(${i},this.value)">${esc(d.notes[i])}</textarea></td>`;
    if(withOpen){const open=notices.filter(n=>n.status!=='تم الإصلاح'&&n.dept&&n.dept.includes(x.a)).length;h+=`<td class="${open?'s-warn':''}">${open||''}</td>`}
    h+='</tr>';
  });
  return h+'</table></div><div class="card"><button class="btn" onclick="saveRound()">حفظ المرور اليومي</button></div>';
}
function vRound(){return roundTable(getDraft(),true)}
function vERound(){return roundTable(getDraft(),false)}
function occupy(i){const d=getDraft();const all=CATS.every((c,j)=>d.marks[i+'_'+j]==='مشغولة');CATS.forEach((c,j)=>d.marks[i+'_'+j]=all?'✓':'مشغولة');d.dirty=true;render()}
function dSet(i,j,v){const d=getDraft();d.marks[i+'_'+j]=v;d.dirty=true;render()}
function dNote(i,v){const d=getDraft();d.notes[i]=v;d.dirty=true;render()}
async function applyRound(date,marks,notes,by){
  await db.collection('rounds').doc(date).set({marks,notes});
  rounds[date]={marks,notes};
  for(let i=0;i<ALL.length;i++)for(let j=0;j<CATS.length;j++){
    if(marks[i+'_'+j]!=='✗')continue;
    const a=ALL[i].a,c=CATS[j];
    if(notices.find(n=>n.src==='مرور'&&n.dept===a&&n.cat===c&&(n.status!=='تم الإصلاح'||n.date===date)))continue;
    await addNotice({date,dept:a,reporter:'المرور اليومي',details:(notes[i]||'عطل')+' – '+c,src:'مرور',cat:c,by:by||''});
  }
}
async function saveRound(){
  const d=getDraft(),marks=fullMarks(d);
  if(window.ROLE==='entry'){await send({type:'round',data:{date:rdate,marks,notes:d.notes}});draft=null;render();return}
  await applyRound(rdate,marks,d.notes,'');draft=null;toast('تم حفظ المرور اليومي ✓');render();
}
/* ---------- الصيانة العلاجية ---------- */
const FLD=['date','time','dept','reporter','details','action','status','fixdate','rep','needbuy','notes','cls'];
function vNotices(){
  let h=`<div class="card"><b>إخطار جديد</b><div class="row">
  <label>التاريخ<input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></label>
  <label>الوقت<input type="time" id="f_time"></label>
  <label>القسم<input id="f_dept"></label><label>مسؤول الإخطار<input id="f_reporter"></label>
  <label>تفاصيل العطل<input id="f_details" style="width:220px"></label><label>الإجراء المتخذ<input id="f_action" style="width:200px"></label>
  <label>الحالة<select id="f_status">${ST.map(s=>`<option ${s==='لم يتم الإصلاح'?'selected':''}>${s}</option>`).join('')}</select></label>

const REP_START='2026-11-07'; // السبت: بداية العمل بالتقارير

const lastThu=(y,m)=>{const d=new Date(y,m+1,0);while(d.getDay()!==4)d.setDate(d.getDate()-1);return ymd(d)};

function weekOptions(){const o=[],t=ymd(new Date());let d=new Date(REP_START+'T12:00:00');

function monthOptions(){const o=[],s0=new Date(REP_START+'T12:00:00'),t=new Date();let y=s0.getFullYear(),m=s0.getMonth();
  while(y<t.getFullYear()||(y===t.getFullYear()&&m<=t.getMonth())){const f=ymd(new Date(y,m,1));o.push({v:y+'-'+(m+1),from:f<REP_START?REP_START:f,to:lastThu(y,m)});m++;if(m>11){m=0;y++}}return o.reverse()}
function repData(from,to){
  const inR=v=>{const x=iso(v);return typeof x==='string'&&x>=from&&x<=to};
  const today=ymd(new Date());
  const nNew=notices.filter(n=>inR(n.date)),nClosed=notices.filter(n=>n.status==='تم الإصلاح'&&inR(n.fixdate));
  const dd=nClosed.map(n=>(new Date(iso(n.fixdate))-new Date(iso(n.date)))/864e5).filter(x=>!isNaN(x)&&x>=0);
  const avg=dd.length?dd.reduce((a,b)=>a+b,0)/dd.length:null;
  const rs=Object.entries(rounds).filter(([d])=>d>=from&&d<=to);
  const byA={},byC={},rec={};let bad=0;
  rs.forEach(([d,r])=>Object.entries(r.marks||{}).forEach(([k,v])=>{if(v!=='✗')return;const [i,j]=k.split('_');const a=ALL[i].a,c=CATS[j];bad++;byA[a]=(byA[a]||0)+1;byC[c]=(byC[c]||0)+1;rec[a+' – '+c]=(rec[a+' – '+c]||0)+1}));
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const pa=purchases.filter(p=>inR(p.rdate)).length,pd=purchases.filter(p=>p.status==='تم الشراء/التوريد'&&inR(p.ddate)||p.status==='تم التركيب'&&inR(p.ddate)).length,pi=purchases.filter(p=>inR(p.idate)).length,pp=purchases.filter(p=>p.status!=='تم التركيب').length;
  return{nNew,nClosed,avg,days:rs.length,span,bad,byA:top(byA),byC:top(byC),rec:top(rec).filter(x=>x[1]>=2),open,pa,pd,pi,pp,openNow:notices.filter(n=>n.status!=='تم الإصلاح').length};
}

    h+=`<h4>التوزيع الأسبوعي</h4>${tbl(['الأسبوع','جديدة','تم إصلاحها','✗ في المرور'],rows)}`;
  }
  return h+'</div>';
}
/* ---------- تعديل / حذف ---------- */
let EM=null;
const NF=[['date','التاريخ','date'],['time','الوقت','time'],['dept','القسم','text'],['reporter','مسؤول الإخطار','text'],['details','تفاصيل العطل','area'],['action','الإجراء المتخذ','area'],['status','الحالة','select',ST],['fixdate','تاريخ الإصلاح','date'],['rep','ممثل الصيانة','text'],['needbuy','يحتاج شراء؟','select',['','نعم','لا']],['notes','ملاحظات','area'],['cls','التصنيف','text']];
function openEdit(kind,id){
  const isN=kind==='notices',row=(isN?notices:purchases).find(x=>x.id===id);if(!row)return;
  const F=isN?NF:[['ref','الإخطار','select',['',...notices.slice().sort((a,b)=>a.n-b.n).map(n=>n.ref)]],['rdate','تاريخ الطلب','date'],['item','الصنف','text'],['qty','الكمية','number'],['status','الحالة','select',PST],['ddate','تاريخ التوريد','date'],['idate','تاريخ التركيب','date'],['notes','ملاحظات','area']];
  EM={kind,id,F};closeEdit();
  const d=document.createElement('div');d.id='md';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;overflow:auto;padding:12px';
  const fld=([k,l,t,o])=>{const v=t==='date'?iso(row[k]):row[k];
    return `<label>${l}${t==='area'?`<textarea id="e_${k}" rows="2" style="min-width:0">${esc(v)}</textarea>`:t==='select'?`<select id="e_${k}">${o.map(x=>`<option ${x===(row[k]||'')?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="e_${k}" type="${t}" value="${esc(v)}">`}</label>`};
  d.innerHTML=`<div class="card" style="max-width:760px;margin:16px auto"><b>${isN?'تعديل الإخطار '+row.ref:'تعديل صنف الشراء'}</b><div class="grid" style="margin-top:8px">${F.map(fld).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="saveEdit()">حفظ</button><button class="btn alt" onclick="closeEdit()">إلغاء</button></div></div>`;
  document.body.appendChild(d);
}
function closeEdit(){const m=document.getElementById('md');if(m)m.remove()}
async function saveEdit(){
  const {kind,id,F}=EM,o={};
  F.forEach(([k,l,t])=>{let v=document.getElementById('e_'+k).value;if(t==='number')v=+v||0;o[k]=v});
  if(kind==='notices'&&o.status==='تم الإصلاح'&&!o.fixdate)o.fixdate=ymd(new Date());
  if(kind==='purchases'&&o.status==='تم التركيب'){if(!o.idate)o.idate=ymd(new Date());if(!o.ddate)o.ddate=o.idate}
  await db.collection(kind).doc(id).update(o);
  if(kind==='purchases'){const p=purchases.find(x=>x.id===id);if(p)Object.assign(p,o);if(o.status==='تم التركيب')await checkAutoClose(o.ref)}
  closeEdit();toast('تم الحفظ ✓');
}
async function checkAutoClose(ref){
  if(!ref)return;const g=purchases.filter(x=>x.ref===ref);
  if(!g.length||!g.every(x=>x.status==='تم التركيب'))return;
  const n=notices.find(x=>x.ref===ref);
  if(n&&n.status!=='تم الإصلاح'){await upd(n.id,{status:'تم الإصلاح',fixdate:ymd(new Date()),viaPurchase:true,notes:(n.notes?n.notes+' | ':'')+'تم الإصلاح تلقائياً بعد الشراء والتركيب'});toast('تم تغيير حالة '+n.ref+' إلى «تم الإصلاح» تلقائياً')}
}
async function delItem(kind,id){
  if(kind==='notices'){
    const n=notices.find(x=>x.id===id);if(!n)return;const its=purchases.filter(p=>p.ref===n.ref);
    if(!confirm('حذف الإخطار '+n.ref+' ('+(n.dept||'')+')؟'+(its.length?'\nمرتبط بـ '+its.length+' صنف شراء وسيُفك ارتباطها.':'')))return;
    for(const p of its)await db.collection('purchases').doc(p.id).update({ref:'',notes:((p.notes||'')+' (الإخطار '+n.ref+' محذوف)').trim()});
    await db.collection('notices').doc(id).delete();
  }else{
    const p=purchases.find(x=>x.id===id);if(!p)return;
    if(!confirm('حذف صنف الشراء «'+p.item+'»؟'))return;
    await db.collection('purchases').doc(id).delete();
  }
  toast('تم الحذف');
}
/* ---------- تقرير متابعة الأعمال اليومي ---------- */
function vDaily(){
  const today=ymd(new Date());
  const open=notices.filter(n=>n.status!=='تم الإصلاح').sort((a,b)=>a.n-b.n);
  const age=n=>{const x=Math.round((new Date(today)-new Date(iso(n.date)))/864e5);return isNaN(x)?'':x};
  const byS={};open.forEach(n=>{const k=n.status||'بدون حالة';byS[k]=(byS[k]||0)+1});
  const nNew=notices.filter(n=>iso(n.date)===today).length,nCl=notices.filter(n=>n.status==='تم الإصلاح'&&iso(n.fixdate)===today).length;
  const r=rounds[today],badList=[];
  if(r)Object.entries(r.marks||{}).forEach(([k,v])=>{if(v==='✗'){const [i,j]=k.split('_');badList.push(ALL[i].a+' – '+CATS[j])}});
  const PLACED=['تم الطلب','تم الشراء/التوريد','تم التركيب'];
  const rows=[];
  notices.filter(n=>n.needbuy==='نعم'&&n.status!=='تم الإصلاح').sort((a,b)=>a.n-b.n).forEach(n=>{
    const its=purchases.filter(p=>p.ref===n.ref);
    if(!its.length)rows.push({ref:n.ref,what:(n.dept||'')+' – '+(n.details||''),item:'لم يُحدد صنف',st:'—',ok:false,rd:'',dd:''});
    else its.filter(p=>p.status!=='تم التركيب').forEach(p=>rows.push({ref:n.ref,what:(n.dept||'')+' – '+(n.details||''),item:p.item+' × '+(p.qty??''),st:p.status,ok:PLACED.includes(p.status),rd:fd(p.rdate),dd:fd(p.ddate)}));
  });
  purchases.filter(p=>!p.ref&&p.status!=='تم التركيب').forEach(p=>rows.push({ref:'—',what:p.notes||'',item:p.item+' × '+(p.qty??''),st:p.status,ok:PLACED.includes(p.status),rd:fd(p.rdate),dd:fd(p.ddate)}));
  const notPlaced=rows.filter(x=>!x.ok).length,ordered=rows.filter(x=>x.st==='تم الطلب').length,delivered=rows.filter(x=>x.st==='تم الشراء/التوريد').length;
  const day=DAYS[new Date(today+'T12:00:00').getDay()];
  const chips=Object.entries(byS).map(([k,v])=>`<span class="${stCls(k)}" style="padding:4px 10px;border-radius:6px;display:inline-block;margin:2px"><b>${v}</b> ${esc(k)}</span>`).join('')||'لا توجد إخطارات مفتوحة';
  return `<div class="card"><div class="row"><button class="btn" onclick="pdf('تقرير_المتابعة_اليومي_${today}')">تصدير PDF</button><button class="btn alt" onclick="render()">تحديث</button></div></div>
  <div class="card" id="rep"><h3>تقرير متابعة الأعمال اليومي – قسم الصيانة – مستشفى الابتسامة</h3>
  <div class="msg">${day} ${dFmt(today)}</div>
  <div class="grid" style="margin:8px 0"><div class="k"><b>${open.length}</b>إخطارات لم يتم إصلاحها</div><div class="k"><b>${nNew}</b>إخطارات جديدة اليوم</div><div class="k"><b>${nCl}</b>تم إصلاحها اليوم</div><div class="k"><b>${notPlaced}</b>أصناف لم يتم عمل طلب لها</div><div class="k"><b>${ordered}</b>تم طلبها ولم تُورَّد</div><div class="k"><b>${delivered}</b>تم توريدها ولم تُركَّب</div></div>
  <div style="margin:6px 0"><b>الإخطارات المفتوحة حسب الحالة:</b> ${chips}</div>
  <div style="margin:6px 0"><b>مرور اليوم:</b> ${r?(badList.length?'محفوظ – أعطال: '+esc(badList.join('، ')):'محفوظ – لا توجد أعطال'):'لم يُحفظ بعد'}</div>
  <h4>الإخطارات التي لم يتم إصلاحها (${open.length})</h4>
  <div style="overflow-x:auto"><table><tr>${['الإخطار','التاريخ','العمر (يوم)','القسم','العطل','الإجراء','الحالة','ممثل الصيانة','شراء؟'].map(x=>`<th>${x}</th>`).join('')}</tr>
  ${open.map(n=>`<tr><td>${n.ref}</td><td>${fd(n.date)}</td><td>${age(n)}</td><td class="l">${esc(n.dept)}</td><td class="l">${esc(n.details)}</td><td class="l">${esc(n.action)}</td><td class="${stCls(n.status)}">${esc(n.status)}</td><td>${esc(n.rep)}</td><td>${esc(n.needbuy)}</td></tr>`).join('')||'<tr><td colspan="9">لا توجد إخطارات مفتوحة</td></tr>'}</table></div>
  <h4>طلبات الشراء المطلوبة (${rows.length})</h4>
  <div style="overflow-x:auto"><table><tr>${['الإخطار','القسم / العطل','الصنف','حالة الصنف','هل تم عمل طلب؟','تاريخ الطلب','تاريخ التوريد'].map(x=>`<th>${x}</th>`).join('')}</tr>
  ${rows.map(x=>`<tr><td>${x.ref}</td><td class="l">${esc(x.what)}</td><td class="l">${esc(x.item)}</td><td>${esc(x.st)}</td><td class="${x.ok?'s-ok':'s-bad'}">${x.ok?'تم عمل طلب':'لم يتم'}</td><td>${x.rd}</td><td>${x.dd}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد طلبات شراء معلقة</td></tr>'}</table></div></div>`;
}
async function pdf(name){
  const el=$('#rep');document.body.classList.add('pdfing');const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});document.body.classList.remove('pdfing');
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'l',unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth()-40,H=doc.internal.pageSize.getHeight()-40,ih=cv.height*W/cv.width;
  let y=0;while(y<ih){doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',20,20-y,W,ih);y+=H;if(y<ih)doc.addPage()}
  dl(name+'_'+new Date().toISOString().slice(0,10)+'.pdf',doc.output('arraybuffer'));
}

/* ---------- صندوق الوارد (مدخل البيانات) ---------- */
const doneI=new Set();
async function procInbox(list){
  list.sort((a,b)=>String(a.o.at).localeCompare(String(b.o.at)));
  for(const x of list){
    if(doneI.has(x.id))continue;doneI.add(x.id);const o=x.o,d=o.data||{};
    try{
      if(o.type==='notice')await addNotice({...d,reporter:d.reporter||'',by:o.by});
      else if(o.type==='purchase'){const k=nextK();await db.collection('purchases').doc('p'+String(k).padStart(4,'0')).set({k,ref:'',rdate:d.rdate,item:d.item,qty:d.qty,status:'جاري إعداد الطلب',ddate:'',notes:d.related||''})}
      else if(o.type==='round')await applyRound(d.date,d.marks,d.notes||{},o.by);
      else if(o.type==='mark'){
        const r=rounds[d.date]||{marks:{},notes:{}};r.marks=r.marks||{};r.notes=r.notes||{};r.marks[d.i+'_'+d.j]=d.v;if(d.note)r.notes[d.i]=d.note;rounds[d.date]=r;
        await db.collection('rounds').doc(d.date).set(r);
        const a=ALL[d.i].a,c=CATS[d.j];
        if(d.v==='✗'&&!notices.find(n=>n.src==='مرور'&&n.dept===a&&n.cat===c&&n.status!=='تم الإصلاح'))
          await addNotice({date:d.date,dept:a,reporter:'المرور اليومي',details:(d.note||'عطل')+' – '+c,src:'مرور',cat:c,by:o.by});
      }
      await db.collection('inbox').doc(x.id).delete();
    }catch(e){doneI.delete(x.id)}
  }
}
/* ---------- واجهة مدخل البيانات ---------- */
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f4e79;color:#fff;padding:10px 18px;border-radius:8px;z-index:50';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
async function send(o){const id='i'+Date.now()+Math.random().toString(36).slice(2,6);await db.collection('inbox').doc(id).set({...o,by:window.USER_EMAIL,at:new Date().toISOString()});toast('تم الإرسال ✓')}
function vENotice(){
  return `<div class="card"><b>إخطار جديد</b><div class="row">
  <label>التاريخ<input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></label><label>الوقت<input type="time" id="f_time"></label>
  <label>القسم<input id="f_dept"></label><label>مسؤول الإخطار<input id="f_reporter"></label>
  <label>تفاصيل العطل<textarea id="f_details" rows="2" style="width:240px"></textarea></label><label>الإجراء المتخذ<textarea id="f_action" rows="2" style="width:220px"></textarea></label>
  <label>الحالة<select id="f_status">${ST.map(s=>`<option ${s==='لم يتم الإصلاح'?'selected':''}>${s}</option>`).join('')}</select></label>
  <label>ممثل الصيانة<input id="f_rep"></label><label>يحتاج شراء؟<select id="f_needbuy"><option>لا</option><option>نعم</option></select></label>
  <button class="btn" onclick="eSaveNotice()">إرسال</button></div></div>`;
}
async function eSaveNotice(){
  const o={};['date','time','dept','reporter','details','action','status','rep','needbuy'].forEach(k=>o[k]=$('#f_'+k).value);
  if(!o.dept||!o.details){alert('اكتب القسم وتفاصيل العطل');return}
  if(o.status==='تم الإصلاح')o.fixdate=o.date;
  await send({type:'notice',data:o});$('#f_details').value='';$('#f_action').value='';$('#f_dept').value='';
}
function vEPurch(){
  return `<div class="card"><b>طلب شراء جديد</b><div class="row">
  <label>تاريخ الطلب<input type="date" id="p_rdate" value="${new Date().toISOString().slice(0,10)}"></label>
  <label>الصنف<input id="p_item"></label><label>الكمية<input id="p_qty" type="number" value="1" style="width:70px"></label>
  <label>المرتبط بالعطل (القسم/العطل)<input id="p_rel" style="width:240px"></label><button class="btn" onclick="eSavePurch()">إرسال</button></div></div>`;
}
async function eSavePurch(){const item=$('#p_item').value;if(!item)return;await send({type:'purchase',data:{rdate:$('#p_rdate').value,item,qty:+$('#p_qty').value,related:$('#p_rel').value}});$('#p_item').value='';$('#p_rel').value=''}
init();
</script>
