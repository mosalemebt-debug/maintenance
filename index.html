(function(){
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  let dbP=null;
  function loginUI(au,auth){
    if(document.getElementById('lg'))return;
    const d=document.createElement('div');d.id='lg';
    d.style.cssText='position:fixed;inset:0;background:#14181f;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
    d.innerHTML='<div style="background:#fff;color:#000;border-radius:12px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;font-family:inherit"><b style="font-size:16px">تسجيل الدخول – برنامج الصيانة</b><input id="lge" type="email" placeholder="البريد الإلكتروني" dir="ltr" style="padding:10px;border:1px solid #999;border-radius:6px"><input id="lgp" type="password" placeholder="كلمة المرور" dir="ltr" style="padding:10px;border:1px solid #999;border-radius:6px"><button id="lgb" style="padding:10px;border:0;border-radius:8px;background:#1f4e79;color:#fff;font:inherit">دخول</button><span id="lgm" style="color:#b42318;font-size:12px"></span></div>';
    document.body.appendChild(d);
    const go=()=>au.signInWithEmailAndPassword(auth,document.getElementById('lge').value.trim(),document.getElementById('lgp').value).catch(()=>{document.getElementById('lgm').textContent='البريد أو كلمة المرور غير صحيحة'});
    document.getElementById('lgb').onclick=go;
    document.getElementById('lgp').onkeydown=e=>{if(e.key==='Enter')go()};
  }
  async function boot(){
    const [a,f,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=a.initializeApp(window.FIREBASE_CONFIG);
    const auth=au.getAuth(app);
    let cache;try{cache=f.persistentLocalCache({tabManager:f.persistentMultipleTabManager()})}catch(e){cache=f.persistentLocalCache()}
    const fs=f.initializeFirestore(app,{localCache:cache,ignoreUndefinedProperties:true});
    const pend={},fc={};
    const upd=()=>{window._pend=Object.values(pend).reduce((a,b)=>a+b,0);const v=Object.values(fc);window._fcAll=v.length>0&&v.every(Boolean);if(window.syncUI)window.syncUI()};
    const fail=e=>{console.error(e);if(window.syncFail)window.syncFail(e)};
    await new Promise(res=>au.onAuthStateChanged(auth,u=>{if(u){const l=document.getElementById('lg');if(l)l.remove();window.USER_EMAIL=u.email;window.ROLE=(!window.ADMIN_EMAIL||(u.email||'').toLowerCase()===window.ADMIN_EMAIL.toLowerCase())?'admin':'entry';res()}else loginUI(au,auth)}));
    return{collection:n=>({
      onSnapshot:cb=>f.onSnapshot(f.collection(fs,n),{includeMetadataChanges:true},s=>{pend[n]=s.docs.filter(d=>d.metadata.hasPendingWrites).length;fc[n]=s.metadata.fromCache;upd();cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))})}),
      doc:id=>{const r=f.doc(fs,n,id);return{set:d=>{f.setDoc(r,d).catch(fail);return Promise.resolve()},update:d=>{f.updateDoc(r,d).catch(fail);return Promise.resolve()},delete:()=>{f.deleteDoc(r).catch(fail);return Promise.resolve()}}}})};
  }
  const DL={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  window.claude={use:async n=>n==='db'?(dbP=dbP||boot()):n==='downloads'?DL:null};
})();
</script>

/* ---------- الأولوية والمهلة ---------- */
const PR=['حرج','عاجل','عادي'],SLA_H={'حرج':4,'عاجل':24,'عادي':72};
const CRIT=['العمليات','الحضانة','طوارئ','غازات','الغازات','مولد','المولد','مصعد','المصعد','التعقيم'];
const autoPrio=(dept,det)=>CRIT.some(k=>((dept||'')+' '+(det||'')).includes(k))?'حرج':'عادي';
const prCls=p=>p==='حرج'?'s-bad':p==='عاجل'?'s-warn':'';
function slaInfo(n){
  const pr=n.prio||autoPrio(n.dept,n.details),h=SLA_H[pr],d=iso(n.date);
  if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return{pr,txt:'',cls:'',over:false};
  const m=String(n.time||'').match(/^(\d{1,2}):(\d{2})/),tm=m?m[1].padStart(2,'0')+':'+m[2]:'08:00';
  const dl=new Date(new Date(d+'T'+tm+':00').getTime()+h*36e5);
  if(n.status==='تم الإصلاح'){const f=iso(n.fixdate);if(typeof f!=='string'||!f)return{pr,txt:'',cls:'',over:false};const ok=f<=ymd(dl);return{pr,txt:ok?'ضمن المهلة':'تجاوز المهلة',cls:ok?'s-ok':'s-bad',over:false}}
  const left=dl-new Date(),a=Math.abs(left)/36e5,t=a<48?Math.round(a)+' س':Math.round(a/24)+' يوم';
  return left>=0?{pr,txt:'متبقي '+t,cls:left<h*36e5*0.25?'s-warn':'',over:false}:{pr,txt:'متأخر '+t,cls:'s-bad',over:true};
}

async function procInbox(list){

      else if(o.type==='round')await applyRound(d.date,d.marks,d.notes||{},o.by);
      else if(o.type==='mark'){
        const r=rounds[d.date]||{marks:{},notes:{}};r.marks=r.marks||{};r.notes=r.notes||{};r.marks[d.i+'_'+d.j]=d.v;if(d.note)r.notes[d.i]=d.note;rounds[d.date]=r;
        await db.collection('rounds').doc(d.date).set(r);
        const a=ALL[d.i].a,c=CATS[d.j];
        if(d.v==='✗'&&!notices.find(n=>n.src==='مرور'&&n.dept===a&&n.cat===c&&n.status!=='تم الإصلاح'))
          await addNotice({date:d.date,dept:a,reporter:'المرور اليومي',details:(d.note||'عطل')+' – '+c,src:'مرور',cat:c,by:o.by});

async function assetBulkCreate(){

function planBy(year){

    if(a.dec==='استبدال'&&!a.decDone&&String(a.decYear)===String(year)){const c=+a.decCost||totVal(a)||0;by[t]=(by[t]||0)+c;list.push({a,c,t})}

async function acUpsert(rows){
  let added=0,updated=0;
  for(const r of rows){
    const [code,fl,place,cap,brand,value,year,model]=r;if(!code)continue;
    const loc='الدور '+fl+' – '+(/^\d+$/.test(String(place))?'غرفة '+place:place);
    const o={code,name:'تكييف '+(model||'')+(brand?' – '+brand:''),type:'تكييف',cap:+cap||0,capu:'حصان',loc,value:+value||0,inst:+year||'',brand:brand||'',model:model||'',src:'حصر التكييفات'};
    const ex=assets.find(a=>String(a.code).trim().toLowerCase()===String(code).toLowerCase());
    if(ex){await db.collection('assets').doc(ex.id).update(o);Object.assign(ex,o);updated++}
    else{const id='as_'+code;assets.push({id,...o});await db.collection('assets').doc(id).set(o);added++}
  }
  return{added,updated};
}

function tplDownload(){const b=atob(TPL_B64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);dl('نموذج_استيراد_الأصول.xlsx',new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
let xi=null;
const XS=v=>String(v==null?'':v).trim();
const XN=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(XS(v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
function xlSheet(ws,needs){
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  for(let i=0;i<Math.min(raw.length,15);i++){const h=raw[i].map(XS);if(needs.every(n=>h.some(c=>c.startsWith(n))))return{raw,hi:i,h}}
  return null;
}
const xcol=(h,k)=>h.findIndex(c=>c.startsWith(k));
function xlParse(wb){

      [['code','الكود'],['mode','طريقة'],['type','النوع'],['name','الاسم'],['qty','العدد'],['fl','الدور'],['pl','المكان'],['brand','الماركة'],['model','الموديل'],['cap','القدرة'],['capu','وحدة'],['inst','سنة'],['life','العمر'],['value','قيمة'],['qf','منها يحتاج'],['qd','منها تالف'],['notes','ملاحظات']].forEach(([k,t])=>C[k]=xcol(h,t));
      const g=(r,k)=>C[k]>=0?r[C[k]]:'';

        if(!nm){er('الاسم ناقص');continue}

        if(!mode)mode=GRP_TYPES.includes(type)?'مجموعة':'فردي';
        if(mode!=='فردي'&&mode!=='مجموعة'){er('طريقة التسجيل لازم تكون فردي أو مجموعة');continue}
        let qty=Math.floor(XN(g(r,'qty'))),qf=Math.floor(XN(g(r,'qf'))),qd=Math.floor(XN(g(r,'qd')));
        if(mode==='مجموعة'){

        }else{
          if(qty<1)qty=1;

          if(code&&qty>1){er('كود محدد مع عدد أكبر من 1: سيب الكود فاضي أو خلي العدد 1');continue}
          qf=0;qd=0;
        }

          cap:XN(g(r,'cap')),capu:XS(g(r,'capu')),brand:XS(g(r,'brand')),model:XS(g(r,'model')),inst:yearOf(g(r,'inst'))||'',life:XN(g(r,'life'))||'',value:XN(g(r,'value')),notes:XS(g(r,'notes'))};
        const ex=code?assetByCode(code):null;

  xi.stock.forEach((r,i)=>{
    const o={name:r.name,qty:r.qty,min:r.min,unit:r.unit,cost:r.cost,loc:r.loc};

  });

    for(let i=0;i<jobs.length;i+=15){await Promise.all(jobs.slice(i,i+15).map(f=>f()));if(msg)msg.textContent='جاري الحفظ… '+Math.min(i+15,jobs.length)+' من '+jobs.length}
  }catch(e){alert('حصل خطأ أثناء الحفظ: '+e.message+'\nراجع السجل وأعد الاستيراد (الأسطر المكررة بتتخطى تلقائياً).');return}
  xi=null;render();
  toast('تم الاستيراد ✓ – أصول '+cA+' · مجموعات '+cG+' · تحديث '+uA+' · مخزن '+(cS+uS));
}

function noLog(fn){return async function(...a){window.NOLOG=true;try{return await fn.apply(this,a)}finally{window.NOLOG=false}}}
/* ---------- الأرقام العربية ---------- */
(function(){
  const AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const cv=t=>String(t).split(/([A-Za-z][A-Za-z0-9_.\-]*)/).map((p,i)=>i%2?p:p.replace(/(\d),(?=\d)/g,'$1٬').replace(/(\d)\.(?=\d)/g,'$1٫').replace(/\d/g,d=>AR[d])).join('');
  window.arDigits=cv;
  const on=localStorage.getItem('arDigits')!=='0';
  const tg=document.getElementById('digtog');
  if(tg){tg.textContent=on?'١٢٣':'123';tg.title=on?'الأرقام عربية – اضغط للأرقام الإنجليزية':'الأرقام إنجليزية – اضغط للأرقام العربية';tg.onclick=()=>{localStorage.setItem('arDigits',on?'0':'1');location.reload()}}
  if(!on)return;
  function walk(n){
    if(n.nodeType===3){const p=n.parentNode;if(p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName))return;const v=n.nodeValue;if(/\d/.test(v)){const c=cv(v);if(c!==v)n.nodeValue=c}}
    else if(n.nodeType===1&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)){n.childNodes.forEach(walk)}
  }
  const mo=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')walk(m.target);else m.addedNodes.forEach(walk)}});
  walk(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  const _al=window.alert.bind(window),_cf=window.confirm.bind(window);
  window.alert=m=>_al(cv(m));window.confirm=m=>_cf(cv(m));
})();

function syncUI(){
  const e=document.getElementById('net');if(!e)return;
  const off=!navigator.onLine,p=window._pend||0;
  let t;
  if(off)t='🔴 غير متصل – شغلك بيتحفظ على الجهاز'+(p?' ('+p+' بانتظار الرفع)':'');
  else if(p)t='🟡 جاري رفع '+p+' تغيير...';
  else if(window._fcAll)t='🟡 جاري الاتصال بالخادم...';
  else t='🟢 متصل ومتزامن';
  e.textContent=t;
  if((window._lastP||0)>0&&p===0&&!off)toast('تمت مزامنة كل التغييرات ✓');
  window._lastP=p;
}
