*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px}

.nt button{padding:6px 12px;font-size:13px}

main{padding:8px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}

label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}

.btn{padding:8px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center;white-space:normal;word-break:break-word;vertical-align:middle}
th{white-space:nowrap}

.msg{color:var(--mut);font-size:12px}

.k.tabk{cursor:pointer;transition:box-shadow .15s}.k.tabk:hover{box-shadow:0 0 0 2px var(--pri)}.k.tabk.on{outline:3px solid var(--pri);outline-offset:1px}

.nar{line-height:1.9;font-size:14px}

function copyRoundTo(){

async function setPurchStatus(id,v){
  const p=purchases.find(x=>x.id===id);if(!p)return;
  const today=ymd(new Date());
  const o={status:v,ddate:(v==='تم الشراء/التوريد'||v==='صرف من المخزن'||v==='تم التركيب')?(p.ddate||today):'',idate:v==='تم التركيب'?today:''};
  if(v==='تم الطلب'&&!p.fin){o.fin='تم الطلب';o.finDate=today}
  Object.assign(p,o);await db.collection('purchases').doc(id).update(o);
  if(v!=='تم التركيب'||!p.ref)return;
  const group=purchases.filter(x=>x.ref===p.ref);
  if(!group.every(x=>x.status==='تم التركيب'))return;
  const n=notices.find(x=>x.ref===p.ref);
  if(n&&n.status!=='تم الإصلاح'){
    await upd(n.id,{status:'تم الإصلاح',fixdate:today,viaPurchase:true,notes:(n.notes?n.notes+' | ':'')+'تم الإصلاح تلقائياً بعد الشراء والتركيب'});

  }
}

async function saveEdit(){

async function checkAutoClose(ref){

async function delItem(kind,id){

    const n=notices.find(x=>x.id===id);if(!n)return;const its=purchases.filter(p=>p.ref===n.ref);

    await db.collection('notices').doc(id).delete();

/* ---------- الأولوية والمهلة ---------- */
const PR=['حرج','عاجل','عادي'],SLA_H={'حرج':4,'عاجل':24,'عادي':72};
const CRIT=['العمليات','الحضانة','طوارئ','غازات','الغازات','مولد','المولد','مصعد','المصعد','التعقيم'];
const autoPrio=(dept,det)=>CRIT.some(k=>((dept||'')+' '+(det||'')).includes(k))?'حرج':'عادي';
const prCls=p=>p==='حرج'?'s-bad':p==='عاجل'?'s-warn':'';
function slaInfo(n){
  const pr=n.prio||autoPrio(n.dept,n.details),h=SLA_H[pr],d=iso(n.date);
  if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return{pr,txt:'',cls:'',over:false};
  const m=String(n.time||'').match(/^(\d{1,2}):(\d{2})/),tm=m?m[1].padStart(2,'0')+':'+m[2]:'08:00';
  const dl=new Date(new Date(d+'T'+tm+':00').getTime()+h*36e5);
  if(n.status==='تم الإصلاح'){const f=iso(n.fixdate);if(typeof f!=='string'||!f)return{pr,txt:'',cls:'',over:false};const ok=f<=ymd(dl);return{pr,txt:ok?'ضمن المهلة':'تجاوز المهلة',cls:ok?'s-ok':'s-bad',over:false}}
  const left=dl-new Date(),a=Math.abs(left)/36e5,t=a<48?Math.round(a)+' س':Math.round(a/24)+' يوم';
  return left>=0?{pr,txt:'متبقي '+t,cls:left<h*36e5*0.25?'s-warn':'',over:false}:{pr,txt:'متأخر '+t,cls:'s-bad',over:true};
}

async function restoreJSON(f){
  if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){alert('الملف غير صالح');return}
  if(d.app!=='maintenance'||!confirm('استعادة البيانات من النسخة؟ سيتم تحديث السجلات المطابقة.'))return;
  const m=document.getElementById('bkmsg');let c=0;
  const put=async(col,arr)=>{for(const x of arr){const {id,...rest}=x;await db.collection(col).doc(id).set(rest);c++;if(m&&c%20===0)m.textContent='جاري الاستعادة... '+c}};
  await put('notices',d.notices||[]);await put('purchases',d.purchases||[]);await put('assets',d.assets||[]);await put('assetLog',d.assetLog||[]);await put('jobsheets',d.jobsheets||[]);await put('stock',d.stock||[]);
  for(const [id,r] of Object.entries(d.rounds||{})){await db.collection('rounds').doc(id).set(r);c++}
  if(m)m.textContent='تمت استعادة '+c+' سجل.';toast('تمت الاستعادة ✓');
}

const PR_PFX=()=>'PR-'+new Date().getFullYear()+'-';
function prSeq(no){const m=String(no||'').match(/^PR-(\d{4})-(\d+)$/);return m&&m[1]===String(new Date().getFullYear())?+m[2]:0}
function prNextNo(){
  const last=Math.max(+((settings.prcounter||{}).last)||0,...purchases.map(p=>prSeq(p.prNo)),0);
  return PR_PFX()+String(last+1).padStart(3,'0');
}
function prAutoNo(items){
  const nos=[...new Set(items.map(p=>p.prNo).filter(Boolean))];
  return nos.length===1&&items.every(p=>p.prNo===nos[0])?nos[0]:prNextNo();
}
async function prCommit(){
  if(!PRS||!PRS.no||PRS.committed===PRS.no)return;
  const no=PRS.no.trim();if(!no)return;
  const items=PRS.ids.map(i=>purchases.find(p=>p.id===i)).filter(Boolean);
  try{
    await Promise.all(items.filter(p=>p.prNo!==no).map(p=>{p.prNo=no;return db.collection('purchases').doc(p.id).update({prNo:no})}));
    const seq=prSeq(no);
    if(seq>(+((settings.prcounter||{}).last)||0))await saveSet('prcounter',{last:seq});
    PRS.committed=no;
  }catch(e){alert('تعذر حفظ رقم الـ PR: '+e.message)}
}

const doneI=new Set();
async function procInbox(list){
  list.sort((a,b)=>String(a.o.at).localeCompare(String(b.o.at)));
  for(const x of list){
    if(doneI.has(x.id))continue;doneI.add(x.id);const o=x.o,d=o.data||{};
    try{
      if(o.type==='notice')await addNotice({...d,reporter:d.reporter||'',by:o.by});
      else if(o.type==='purchase'){const k=nextK();await db.collection('purchases').doc(uid('p',k)).set({k,ref:'',rdate:d.rdate,item:d.item,qty:d.qty,status:'جاري إعداد الطلب',ddate:'',notes:d.related||''})}
      else if(o.type==='round')await applyRound(d.date,d.marks,d.notes||{},o.by);
      else if(o.type==='mark'){
        const r=rounds[d.date]||{marks:{},notes:{}};r.marks=r.marks||{};r.notes=r.notes||{};r.marks[d.i+'_'+d.j]=d.v;if(d.note)r.notes[d.i]=d.note;rounds[d.date]=r;
        await db.collection('rounds').doc(d.date).set(r);
        const a=ALL[d.i].a,c=CATS[d.j];
        if(d.v==='✗'&&!notices.find(n=>n.src==='مرور'&&n.dept===a&&n.cat===c&&n.status!=='تم الإصلاح'))
          await addNotice({date:d.date,dept:a,reporter:'المرور اليومي',details:(d.note||'عطل')+' – '+c,src:'مرور',cat:c,by:o.by});
      }
      await db.collection('inbox').doc(x.id).delete();
    }catch(e){doneI.delete(x.id)}
  }
}

function wrapDb(raw){
  const T={notices:()=>notices,purchases:()=>purchases,assets:()=>assets,stock:()=>stock,jobsheets:()=>jobsheets};
  const lbl=(c,o)=>c==='notices'?((o.ref||'')+' '+(o.dept||'')).trim():c==='purchases'?(o.item||''):c==='assets'?((o.code||'')+' '+(o.name||'')):c==='stock'?(o.name||''):c==='jobsheets'?((o.no||'')+' '+(o.contractor||'')):'';

  const diff=(a,b)=>{const ch={};Object.keys(b).forEach(k=>{if(SKIP.includes(k))return;if(JSON.stringify(a[k]??'')!==JSON.stringify(b[k]??''))ch[k]=[cut(a[k]),cut(b[k])]});return ch};

  };
  return{collection:name=>{const c=raw.collection(name);const find=id=>T[name]?T[name]().find(x=>x.id===id):null;return{

function assetStats(a){

function afOK(x){

  if(af.lc&&a.f!==af.lc&&!String(a.loc||'').includes(af.lc))return false;

  const tr=l=>l.map(r=>`<tr><td><b>${esc(r.a.code)}</b></td><td class="l">${esc(r.a.name)}</td><td class="l">${esc(r.a.loc)}</td><td>${r.t}</td><td>${money(r.c)}</td><td class="l">${esc(r.a.decWhy||'')}</td></tr>`).join('');
  const head=['الكود','الأصل','الموقع','التخصص','التكلفة (ج.م)','السبب'].map(x=>`<th>${x}</th>`).join('');
  return `<h4>خطة الاستبدال لسنة ${year} (قرارات اتُّخذت): ${money(p.list.reduce((t,r)=>t+r.c,0))} ج.م</h4><div style="overflow-x:auto"><table><tr>${head}</tr>${tr(p.list)||'<tr><td colspan="6">لا توجد قرارات استبدال مخططة لهذه السنة — حددها من «قرار» في سجل الأصول</td></tr>'}</table></div>`;
}

const yearOf=v=>{if(v==null||v==='')return 0;if(v instanceof Date)return v.getFullYear();const m=String(v).match(/\d{4}/);return m?+m[0]:0};
const yearTxt=v=>{const y=yearOf(v);return y?y+' ('+(new Date().getFullYear()-y)+' سنة)':''};
async function assetBulkCap(){
  const f=$('#bk_f').value.trim(),t=$('#bk_t').value.trim(),c=+$('#bk_c').value;
  const m1=f.match(/^(.*?)(\d+)$/),m2=t.match(/^(.*?)(\d+)$/);
  if(!m1||!m2||m1[1].toLowerCase()!==m2[1].toLowerCase()||!(c>0)){alert('اكتب كودين بنفس البادئة (مثل AC-05 و AC-20) وقدرة أكبر من صفر');return}
  const lo=+m1[2],hi=+m2[2],pre=m1[1].toLowerCase();
  const list=assets.filter(a=>{const m=String(a.code).match(/^(.*?)(\d+)$/);return m&&m[1].toLowerCase()===pre&&+m[2]>=lo&&+m[2]<=hi});
  if(!list.length){alert('لا توجد أصول في هذا النطاق');return}
  if(!confirm('تعيين القدرة '+c+' '+$('#bk_u').value+' لعدد '+list.length+' أصل؟'))return;
  for(const a of list)await db.collection('assets').doc(a.id).update({cap:c,capu:$('#bk_u').value});
  toast('تم تحديث '+list.length+' أصل');
}

function tplDownload(){const b=atob(TPL_B64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);dl('نموذج_استيراد_الأصول.xlsx',new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
let xi=null;
const XS=v=>String(v==null?'':v).trim();
const XN=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(XS(v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:0};
function xlSheet(ws,needs){
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  for(let i=0;i<Math.min(raw.length,15);i++){const h=raw[i].map(XS);if(needs.every(n=>h.some(c=>c.startsWith(n))))return{raw,hi:i,h}}
  return null;
}
const xcol=(h,k)=>h.findIndex(c=>c.startsWith(k));
function xlParse(wb){
  const out={rows:[],err:[],stock:[],stErr:[],hasA:false,hasS:false};
  const codesSeen=new Set(),keysSeen=new Set(assets.map(a=>a.impKey).filter(Boolean));
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name];if(!ws)continue;
    const A=!out.hasA&&xlSheet(ws,['النوع','الاسم']);
    if(A){out.hasA=true;const{raw,hi,h}=A,C={};
      [['code','الكود'],['mode','طريقة'],['type','النوع'],['name','الاسم'],['qty','العدد'],['fl','الدور'],['pl','المكان'],['brand','الماركة'],['model','الموديل'],['cap','القدرة'],['capu','وحدة'],['inst','سنة'],['life','العمر'],['value','قيمة'],['qf','منها يحتاج'],['qd','منها تالف'],['notes','ملاحظات']].forEach(([k,t])=>C[k]=xcol(h,t));
      const g=(r,k)=>C[k]>=0?r[C[k]]:'';
      for(let i=hi+1;i<raw.length;i++){
        const r=raw[i],rowNo=i+1;
        if(r.every(c=>XS(c)===''))continue;
        if(XS(g(r,'code')).startsWith('مثال'))continue;
        const er=m=>out.err.push({row:rowNo,msg:m});
        const code=XS(g(r,'code')),type=XS(g(r,'type')),nm=XS(g(r,'name'));
        if(!nm){er('الاسم ناقص');continue}
        if(!ATY.includes(type)){er(type?'النوع «'+type+'» غير موجود في القائمة':'النوع ناقص');continue}
        let mode=XS(g(r,'mode'));
        if(!mode)mode=GRP_TYPES.includes(type)?'مجموعة':'فردي';
        if(mode!=='فردي'&&mode!=='مجموعة'){er('طريقة التسجيل لازم تكون فردي أو مجموعة');continue}
        let qty=Math.floor(XN(g(r,'qty'))),qf=Math.floor(XN(g(r,'qf'))),qd=Math.floor(XN(g(r,'qd')));
        if(mode==='مجموعة'){
          if(qty<1){er('العدد مطلوب للمجموعة');continue}
          if(qf<0||qd<0||qf+qd>qty){er('«يحتاج إصلاح» + «تالف» أكبر من العدد الكلي ('+qty+')');continue}
        }else{
          if(qty<1)qty=1;
          if(qty>200){er('العدد الفردي لا يزيد عن 200 في السطر الواحد');continue}
          if(code&&qty>1){er('كود محدد مع عدد أكبر من 1: سيب الكود فاضي أو خلي العدد 1');continue}
          qf=0;qd=0;
        }
        if(code){const lc=code.toLowerCase();if(codesSeen.has(lc)){er('الكود «'+code+'» مكرر في الملف');continue}codesSeen.add(lc)}
        const fl=XS(g(r,'fl')),pl=XS(g(r,'pl')),loc=fl&&pl?fl+' – '+pl:(fl||pl);
        const rec={row:rowNo,code,type,name:nm,mode,qty,qf,qd,loc,
          cap:XN(g(r,'cap')),capu:XS(g(r,'capu')),brand:XS(g(r,'brand')),model:XS(g(r,'model')),inst:yearOf(g(r,'inst'))||'',life:XN(g(r,'life'))||'',value:XN(g(r,'value')),notes:XS(g(r,'notes'))};
        const ex=code?assetByCode(code):null;
        if(ex){rec.action='update';rec.id=ex.id;out.rows.push(rec);continue}
        const base=['xl',mode,type,nm,loc].join('|').toLowerCase(),n=mode==='فردي'?qty:1,keys=[];
        for(let k=0;k<n;k++)keys.push(base+(n>1?'|'+k:''));
        if(!code&&keys.every(k=>keysSeen.has(k))){rec.action='skip';rec.n=n;out.rows.push(rec);continue}
        keys.forEach(k=>keysSeen.add(k));rec.action='create';rec.n=n;rec.keys=keys;out.rows.push(rec);
      }
    }
    const S=!out.hasS&&xlSheet(ws,['الصنف','الرصيد']);
    if(S){out.hasS=true;const{raw,hi,h}=S,C={};
      [['name','الصنف'],['qty','الرصيد'],['min','الحد'],['unit','الوحدة'],['cost','سعر'],['loc','مكان']].forEach(([k,t])=>C[k]=xcol(h,t));
      const g=(r,k)=>C[k]>=0?r[C[k]]:'',seen=new Set();
      for(let i=hi+1;i<raw.length;i++){
        const r=raw[i];if(r.every(c=>XS(c)===''))continue;
        const nm=XS(g(r,'name'));if(!nm){out.stErr.push({row:i+1,msg:'اسم الصنف ناقص'});continue}
        const lc=nm.toLowerCase();if(seen.has(lc)){out.stErr.push({row:i+1,msg:'الصنف «'+nm+'» مكرر في الملف'});continue}seen.add(lc);
        const ex=stock.find(x=>XS(x.name).toLowerCase()===lc);
        out.stock.push({row:i+1,name:nm,qty:XN(g(r,'qty')),min:XN(g(r,'min')),unit:XS(g(r,'unit'))||'قطعة',cost:XN(g(r,'cost')),loc:XS(g(r,'loc')),action:ex?'update':'create',id:ex?ex.id:''});
      }
    }
  }
  return out;
}
async function xlLoad(f){
  if(!f)return;
  if(typeof XLSX==='undefined'){alert('مكتبة الإكسل غير محملة – تأكد من الإنترنت وجرّب تاني');return}
  let r;try{r=xlParse(XLSX.read(await f.arrayBuffer()))}catch(e){alert('تعذر قراءة الملف: '+e.message);return}
  if(!r.hasA&&!r.hasS){alert('مش لاقي ورقة «الأصول» أو «المخزن» بالعناوين المتوقعة. استخدم «تحميل النموذج» ولا تغيّر العناوين.');return}
  r.file=f.name;xi=r;render();
}
function xlCancel(){xi=null;render()}
function vXlImport(){
  let h=`<div class="card addf"><b>استيراد من نموذج Excel (أصول فردية ومجموعات + مخزن)</b><div class="msg hint">حمّل النموذج، املأه بره البرنامج، وارفعه هنا. هتشوف معاينة قبل أي حفظ.</div><div class="row" style="margin-top:6px"><button class="btn alt" onclick="tplDownload()">تحميل النموذج</button><label class="btn" style="flex-direction:row">اختيار الملف المملوء<input type="file" accept=".xlsx" onchange="xlLoad(this.files[0]);this.value=''" hidden></label></div>`;
  if(xi){
    const cr=xi.rows.filter(r=>r.action==='create'),up=xi.rows.filter(r=>r.action==='update'),sk=xi.rows.filter(r=>r.action==='skip');
    const nInd=cr.filter(r=>r.mode==='فردي').reduce((t,r)=>t+r.n,0),nGrp=cr.filter(r=>r.mode==='مجموعة').length;
    const sc=xi.stock.filter(r=>r.action==='create').length,su=xi.stock.filter(r=>r.action==='update').length;

function stParse(wb){
  const out={rows:[],err:[]};
  let found=null;
  for(const name of wb.SheetNames){const r=wb.Sheets[name]&&xlSheet(wb.Sheets[name],['الصنف','الرصيد']);if(r){found=r;break}}
  if(!found)return null;
  const{raw,hi,h}=found,C={};
  [['name','الصنف'],['qty','الرصيد'],['min','الحد'],['unit','الوحدة'],['cost','سعر'],['loc','مكان']].forEach(([k,t])=>C[k]=xcol(h,t));
  const g=(r,k)=>C[k]>=0?r[C[k]]:'',has=(r,k)=>C[k]>=0&&XS(r[C[k]])!=='',seen=new Set();
  for(let i=hi+1;i<raw.length;i++){
    const r=raw[i];if(r.every(c=>XS(c)===''))continue;
    const nm=XS(g(r,'name'));
    if(!nm){out.err.push({row:i+1,msg:'اسم الصنف ناقص'});continue}
    if(nm.startsWith('مثال'))continue;
    const lc=nm.toLowerCase();
    if(seen.has(lc)){out.err.push({row:i+1,msg:'الصنف «'+nm+'» مكرر في الملف'});continue}seen.add(lc);
    if(has(r,'qty')&&!isFinite(parseFloat(XS(g(r,'qty')).replace(/[^\d.\-]/g,''))) ){out.err.push({row:i+1,msg:'الرصيد «'+XS(g(r,'qty'))+'» غير صالح'});continue}
    const ex=stock.find(x=>XS(x.name).toLowerCase()===lc);
    out.rows.push({row:i+1,name:nm,qty:XN(g(r,'qty')),hasMin:has(r,'min'),min:XN(g(r,'min')),hasUnit:has(r,'unit'),unit:XS(g(r,'unit')),hasCost:has(r,'cost'),cost:XN(g(r,'cost')),hasLoc:has(r,'loc'),loc:XS(g(r,'loc')),action:ex?'update':'create',id:ex?ex.id:'',old:ex?(+ex.qty||0):0});
  }
  return out;
}

function noLog(fn){return async function(...a){window.NOLOG=true;try{return await fn.apply(this,a)}finally{window.NOLOG=false}}}
/* ---------- الأرقام العربية ---------- */
(function(){
  const AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const cv=t=>String(t).split(/([A-Za-z][A-Za-z0-9_.\-]*)/).map((p,i)=>i%2?p:p.replace(/(\d),(?=\d)/g,'$1٬').replace(/(\d)\.(?=\d)/g,'$1٫').replace(/\d/g,d=>AR[d])).join('');
  window.arDigits=cv;
  const on=localStorage.getItem('arDigits')!=='0';
  const tg=document.getElementById('digtog');
  if(tg){tg.textContent=on?'١٢٣':'123';tg.title=on?'الأرقام عربية – اضغط للأرقام الإنجليزية':'الأرقام إنجليزية – اضغط للأرقام العربية';tg.onclick=()=>{localStorage.setItem('arDigits',on?'0':'1');location.reload()}}
  if(!on)return;
  function walk(n){
    if(n.nodeType===3){const p=n.parentNode;if(p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName))return;const v=n.nodeValue;if(/\d/.test(v)){const c=cv(v);if(c!==v)n.nodeValue=c}}
    else if(n.nodeType===1&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)){n.childNodes.forEach(walk)}
  }
  const mo=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')walk(m.target);else m.addedNodes.forEach(walk)}});
  walk(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  const _al=window.alert.bind(window),_cf=window.confirm.bind(window);
  window.alert=m=>_al(cv(m));window.confirm=m=>_cf(cv(m));
})();
/* ---------- حقول التاريخ: يوم/شهر/سنة ---------- */
(function(){
  const pad=n=>String(n).padStart(2,'0');
  const toDisp=v=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
  const parse=t=>{t=String(t).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim();
    const m=/^(\d{1,2})\D+(\d{1,2})\D+(\d{4})$/.exec(t)||/^(\d{2})(\d{2})(\d{4})$/.exec(t);if(!m)return null;
    const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(Date.UTC(y,mo-1,d));
    if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return null;return y+'-'+pad(mo)+'-'+pad(d)};
  const vd=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function enhance(inp){
    if(inp._ard)return;inp._ard=1;
    const w=document.createElement('span');w.style.cssText='position:relative;display:inline-flex;gap:4px;align-items:center';
    const t=document.createElement('input');t.type='text';t.inputMode='numeric';t.placeholder='يوم/شهر/سنة';t.maxLength=10;t.dir='ltr';t.style.cssText='width:112px;min-width:0;text-align:center';
    const b=document.createElement('button');b.type='button';b.textContent='📅';b.tabIndex=-1;b.className='btn sm alt';b.style.cssText='padding:4px 8px';
    inp.parentNode.insertBefore(w,inp);w.append(t,b,inp);
    inp.style.cssText='position:absolute;left:0;bottom:0;width:1px;height:1px;min-width:0;opacity:0;pointer-events:none;border:0;padding:0';
    Object.defineProperty(inp,'value',{get(){return vd.get.call(inp)},set(v){vd.set.call(inp,v);t.value=toDisp(v)},configurable:true});
    t.value=toDisp(vd.get.call(inp));
    b.onclick=()=>{try{inp.showPicker()}catch(e){inp.focus();inp.click()}};
    inp.addEventListener('change',()=>{t.value=toDisp(vd.get.call(inp))});
    t.addEventListener('input',e=>{if(e.inputType==='insertText'&&(/^\d{2}$/.test(t.value)||/^\d{2}\/\d{2}$/.test(t.value)))t.value+='/'});
    t.addEventListener('change',()=>{
      const raw=t.value.trim();
      if(!raw){vd.set.call(inp,'');inp.dispatchEvent(new Event('change',{bubbles:true}));return}
      const v=parse(raw);
      if(v){vd.set.call(inp,v);t.value=toDisp(v);inp.dispatchEvent(new Event('change',{bubbles:true}))}
      else{alert('اكتب التاريخ بالشكل يوم/شهر/سنة، مثال: 25/10/2026');t.value=toDisp(vd.get.call(inp))}
    });
  }
  const scan=n=>{if(n.nodeType!==1)return;if(n.matches&&n.matches('input[type=date]'))enhance(n);n.querySelectorAll&&n.querySelectorAll('input[type=date]').forEach(enhance)};
  scan(document.body);
  new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(scan)}).observe(document.body,{childList:true,subtree:true});
})();

function syncUI(){
  const e=document.getElementById('net');if(!e)return;
  const off=!navigator.onLine,p=window._pend||0;
  let t;
  if(off)t='🔴 غير متصل – شغلك بيتحفظ على الجهاز'+(p?' ('+p+' بانتظار الرفع)':'');
  else if(p)t='🟡 جاري رفع '+p+' تغيير...';
  else if(window._fcAll)t='🟡 جاري الاتصال بالخادم...';
  else t='🟢 متصل ومتزامن';
  e.textContent=t;
  if((window._lastP||0)>0&&p===0&&!off)toast('تمت مزامنة كل التغييرات ✓');
  window._lastP=p;
}
